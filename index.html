<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisiovida</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3a4163">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fisiovida">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* ── BRAND FISIOVIDA ── */
      --bg:           #F2F4F7;
      --surface:      #FFFFFF;
      --surface-2:    #EAECf0;

      /* Azul vibrante da logo */
      --primary:      #4fa0d4;
      --primary-lt:   #ddf0fa;
      --primary-dk:   #3a4163;
      --primary-md:   #2e7db8;

      /* Verde da logo */
      --accent:       #95bb29;
      --accent-lt:    #eef5d4;
      --accent-dk:    #7a9a1e;
      --accent-md:    #82a522;

      /* Complementares */
      --blue-lt:      #99d0e9;
      --yellow-lt:    #d4e08a;

      /* Gradiente da logo (azul → verde) */
      --grad:         linear-gradient(135deg, #3a4163 0%, #4fa0d4 60%, #95bb29 100%);
      --grad-h:       linear-gradient(135deg, #4fa0d4, #95bb29);
      --grad-btn:     linear-gradient(135deg, #4fa0d4, #2e7db8);

      --f1:#E04545; --f1-bg:#FDEAEA;
      --f2:#D4860A; --f2-bg:#FEF3E2;
      --f3:#95bb29; --f3-bg:#eef5d4;

      --txt:#1A1D2E; --txt2:#4A5568; --txt3:#9AA5B4;
      --border:#DDE2EA; --bord2:#C8D0DC;

      --r:14px; --r-sm:8px; --r-lg:20px;
      --sh:0 2px 12px rgba(58,65,99,.08),0 1px 4px rgba(0,0,0,.04);
      --sh-md:0 6px 24px rgba(58,65,99,.14);
      --sh-lg:0 12px 48px rgba(58,65,99,.18);
      --sw:264px;
    }
    html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
    #app{height:100%;display:flex;flex-direction:column;}
    .layout{display:flex;height:100%;}

    /* ── SIDEBAR ── */
    .sidebar{width:var(--sw);background:linear-gradient(180deg,#2a3057 0%,#3a4163 40%,#2d6fa0 100%);display:flex;flex-direction:column;flex-shrink:0;position:fixed;left:0;top:0;bottom:0;height:100vh;z-index:160;transform:translateX(-100%);transition:transform .25s;overflow:hidden;}
    .sidebar::after{content:'';position:absolute;bottom:-80px;right:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none;}
    .sb-logo{padding:24px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px;}
    .sb-logo-icon{width:36px;height:36px;flex-shrink:0;}
    .sb-logo h1{font-family:'DM Serif Display',serif;font-size:20px;color:#fff;letter-spacing:-.3px;line-height:1.1;}
    .sb-logo span{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.5px;text-transform:uppercase;font-weight:500;display:block;margin-top:1px;}
    .sb-nav{padding:14px 10px;flex:1;display:flex;flex-direction:column;gap:2px;}
    .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;color:rgba(255,255,255,.6);font-size:14px;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
    .nav-btn:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);}
    .nav-btn.active{background:rgba(255,255,255,.12);color:#fff;}
    .nav-badge{margin-left:auto;background:linear-gradient(135deg,#95bb29,#7a9a1e);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;min-width:20px;text-align:center;box-shadow:0 2px 6px rgba(149,187,41,.4);}
    .sb-foot{padding:10px 10px 14px;border-top:1px solid rgba(255,255,255,.08);}
    .u-card{display:flex;align-items:center;gap:10px;padding:8px 12px;}
    .u-av{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:12px;color:#fff;flex-shrink:0;}
    .u-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .u-role{font-size:11px;color:rgba(255,255,255,.4);}
    .nav-btn-cfg{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;color:rgba(255,255,255,.35);font-size:12px;font-weight:400;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;margin-top:2px;}
    .nav-btn-cfg:hover{color:rgba(255,255,255,.65);background:rgba(255,255,255,.05);}
    .nav-btn-cfg.cfg-active{color:rgba(255,255,255,.75);}
    .btn-sair{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-sm);cursor:pointer;color:rgba(255,255,255,.25);font-size:11px;transition:all .15s;border:none;background:none;width:100%;font-family:'DM Sans',sans-serif;}
    .btn-sair:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);}

    /* ── MAIN ── */
    .main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
    .ph{padding:28px 32px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
    .ph-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--primary-dk);letter-spacing:-.5px;}
    .ph-sub{font-size:14px;color:var(--txt2);margin-top:4px;}
    .pc{padding:24px 32px 48px;flex:1;}

    /* ── BUTTONS ── */
    .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r-sm);font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
    .btn-p{background:var(--grad-btn);color:#fff;border:none;}
    .btn-p:hover{background:linear-gradient(135deg,#3a4163,#2e7db8);transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,160,212,.4);}
    .btn-acc{background:linear-gradient(135deg,#95bb29,#7a9a1e);color:#fff;}
    .btn-acc:hover{background:var(--accent-dk);transform:translateY(-1px);box-shadow:0 4px 12px rgba(149,187,41,.3);}
    .btn-s{background:var(--surface);color:var(--txt);border:1.5px solid var(--border);}
    .btn-s:hover{border-color:var(--bord2);background:var(--surface-2);}
    .btn-g{background:transparent;color:var(--txt2);}
    .btn-g:hover{background:var(--surface-2);}
    .btn-sm{padding:6px 12px;font-size:13px;}
    .btn-lg{padding:12px 24px;font-size:15px;}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}

    /* ── CARDS ── */
    .card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:20px;box-shadow:var(--sh);}
    .card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .card-t{font-size:15px;font-weight:600;color:var(--txt);}

    /* ── FORMS ── */
    .fg{margin-bottom:16px;}
    .fl{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:6px;}
    .fi,.fta,.fsel{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--txt);background:var(--surface);transition:border-color .15s,box-shadow .15s;outline:none;}
    .fi:focus,.fta:focus,.fsel:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,160,212,.18);}
    .fta{resize:vertical;min-height:90px;}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

    /* ── BADGES ── */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
    .b-f1{background:#FEE2E2;color:#C53030;}
    .b-f2{background:#FEF3CD;color:#92400E;}
    .b-f3{background:var(--accent-lt);color:var(--accent-dk);}
    .b-n{background:var(--surface-2);color:var(--txt2);}
    .b-p{background:var(--primary-lt);color:var(--primary-md);border:1px solid rgba(79,160,212,.2);}
    .b-acc{background:var(--accent-lt);color:var(--accent-dk);border:1px solid rgba(149,187,41,.25);}

    /* ── LOGIN ── */
    .login-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;position:relative;overflow:hidden;}
    .login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 900px 700px at 70% 20%,rgba(79,160,212,.12) 0%,transparent 65%),radial-gradient(ellipse 600px 500px at 20% 80%,rgba(149,187,41,.1) 0%,transparent 65%),radial-gradient(ellipse 400px 400px at 50% 50%,rgba(58,65,99,.05) 0%,transparent 70%);}
    .login-card{background:var(--surface);border-radius:var(--r-lg);padding:48px 44px;width:100%;max-width:420px;box-shadow:var(--sh-lg);border:1px solid var(--border);position:relative;z-index:1;}
    .login-logo{text-align:center;margin-bottom:36px;}
    .login-logo h1{font-family:'DM Serif Display',serif;font-size:38px;background:var(--grad-h);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px;}
    .login-logo p{font-size:12px;color:var(--txt3);margin-top:4px;letter-spacing:1.2px;text-transform:uppercase;font-weight:500;}
    .login-err{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px;display:none;}

    /* ── PATIENTS GRID ── */
    .search-bar{position:relative;margin-bottom:20px;}
    .search-bar input{width:100%;padding:11px 16px 11px 44px;border:1.5px solid var(--border);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--surface);color:var(--txt);outline:none;transition:border-color .15s;}
    .search-bar input:focus{border-color:var(--primary);}
    .search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:18px;}
    .pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
    .pac-card{background:var(--surface);border-radius:var(--r);padding:20px;border:1.5px solid var(--border);box-shadow:var(--sh);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:14px;}
    .pac-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 8px 28px rgba(79,160,212,.2);}
    .pac-card-hd{display:flex;align-items:center;gap:12px;}
    .pac-av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--primary-lt),var(--accent-lt));display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:17px;color:var(--primary-dk);flex-shrink:0;overflow:hidden;}
    .pac-av img{width:100%;height:100%;object-fit:cover;}
    .pac-nm{font-size:15px;font-weight:600;color:var(--txt);}
    .pac-info{font-size:12px;color:var(--txt2);margin-top:1px;}
    .pac-ft{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);}
    .prog-lbl{font-size:11px;color:var(--txt3);font-weight:500;margin-bottom:4px;}
    .prog-bar{width:120px;height:5px;background:var(--surface-2);border-radius:10px;overflow:hidden;}
    .prog-fill{height:100%;background:var(--grad-h);border-radius:10px;transition:width .4s;box-shadow:0 1px 4px rgba(149,187,41,.3);}

    /* ── PATIENT HERO ── */
    .p-hero{background:var(--surface);border-radius:var(--r-lg);padding:24px 28px;border:1px solid var(--border);box-shadow:var(--sh);display:flex;align-items:flex-start;gap:20px;margin-bottom:20px;}
    .p-hero-av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary-lt),var(--accent-lt));display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:26px;color:var(--primary-dk);flex-shrink:0;overflow:hidden;border:3px solid var(--primary);}
    .p-hero-av img{width:100%;height:100%;object-fit:cover;}
    .p-hero-nm{font-family:'DM Serif Display',serif;font-size:24px;color:var(--txt);letter-spacing:-.3px;}
    .p-hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
    .meta-it{font-size:13px;color:var(--txt2);}
    .p-hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}
    .pdf-btns{display:flex;gap:6px;}

    /* ── PACOTE BAR ── */
    .pk-bar{background:linear-gradient(135deg,var(--primary-lt) 0%,var(--accent-lt) 100%);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px;border:1px solid rgba(79,160,212,.2);}
    .pk-info{flex:1;}
    .pk-label{font-size:12px;font-weight:600;color:var(--txt2);}
    .pk-count{font-family:'DM Serif Display',serif;font-size:20px;color:var(--txt);}
    .pk-prog{flex:2;height:8px;background:var(--border);border-radius:10px;overflow:hidden;}
    .pk-fill{height:100%;background:var(--grad-h);border-radius:10px;transition:width .6s;box-shadow:0 2px 6px rgba(79,160,212,.25);}

    /* ── TABS ── */
    .tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:24px;}
    .tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
    .tab:hover{color:var(--txt);}
    .tab.active{color:var(--accent-dk);border-bottom-color:var(--accent);border-bottom-width:3px;font-weight:700;}

    /* ── TIMELINE ── */
    .timeline{position:relative;padding-left:40px;}
    .timeline::before{content:'';position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,var(--f1),var(--primary),var(--accent));opacity:.5;border-radius:2px;}
    .tl-phase{display:flex;align-items:center;gap:10px;margin:24px 0 12px;position:relative;}
    .tl-phase:first-child{margin-top:0;}
    .tl-phase-dot{position:absolute;left:-31px;width:12px;height:12px;border-radius:50%;}
    .tl-item{position:relative;margin-bottom:14px;}
    .tl-dot{position:absolute;left:-32px;top:16px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);}
    .tl-dot-f1{background:var(--f1);box-shadow:0 0 0 2px var(--f1);}
    .tl-dot-f2{background:var(--f2);box-shadow:0 0 0 2px var(--f2);}
    .tl-dot-f3{background:var(--accent);box-shadow:0 0 0 2px var(--accent);}
    .tl-card{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1.5px solid var(--border);box-shadow:var(--sh);cursor:pointer;transition:all .2s;}
    .tl-card:hover{border-color:var(--primary);transform:translateX(4px);box-shadow:0 4px 16px rgba(79,160,212,.18);}
    .tl-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .tl-card-t{font-size:14px;font-weight:600;color:var(--txt);}
    .tl-card-d{font-size:12px;color:var(--txt3);}
    .tl-procs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
    .proc-tag{background:linear-gradient(135deg,var(--primary-lt),var(--accent-lt));color:var(--primary-dk);padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid rgba(79,160,212,.15);}
    .tl-photos{display:flex;gap:6px;overflow-x:auto;margin-top:8px;}
    .tl-photo{width:52px;height:52px;border-radius:7px;object-fit:cover;border:1.5px solid var(--border);flex-shrink:0;}
    .tl-empty{text-align:center;padding:56px 24px;background:var(--surface);border-radius:var(--r);border:2px dashed var(--border);}

    /* ── PROC GRID ── */
    .proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px;}
    .proc-check{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--txt2);user-select:none;}
    .proc-check input{display:none;}
    .proc-check:has(input:checked){background:var(--accent-lt);border-color:var(--accent);color:var(--accent-dk);}
    .proc-chk-dot{width:16px;height:16px;border-radius:4px;border:2px solid var(--bord2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
    .proc-check:has(input:checked) .proc-chk-dot{background:var(--accent);border-color:var(--accent);}

    /* ── PHOTO UPLOAD ── */
    .photo-drop{border:2px dashed var(--border);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface-2);}
    .photo-drop:hover,.photo-drop.drag{border-color:var(--primary);background:var(--primary-lt);}
    .photos-prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px;}
    .ph-prev{position:relative;aspect-ratio:1;}
    .ph-prev img{width:100%;height:100%;object-fit:cover;border-radius:var(--r-sm);border:1.5px solid var(--border);}
    .ph-rm{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.65);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;border:none;}

    /* ── AI BOX ── */
    .ai-box{background:var(--grad);border-radius:var(--r);padding:22px;color:#fff;margin-top:16px;box-shadow:0 6px 24px rgba(58,65,99,.2);}
    .ai-box-hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
    .ai-box-t{font-size:14px;font-weight:600;}
    .ai-box-s{font-size:12px;opacity:.7;margin-top:2px;}
    .ai-result{background:rgba(255,255,255,.1);border-radius:var(--r-sm);padding:14px;font-size:13px;line-height:1.65;margin-top:14px;white-space:pre-wrap;max-height:320px;overflow-y:auto;}
    .ai-loading{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.8;margin-top:14px;}
    .ai-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}

    /* ── AGENDA ── */
    .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .cal-month{font-family:'DM Serif Display',serif;font-size:22px;color:var(--txt);letter-spacing:-.3px;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
    .cal-dow{font-size:11px;font-weight:700;color:var(--txt3);text-align:center;padding:8px 0;text-transform:uppercase;letter-spacing:.5px;}
    .cal-day{min-height:80px;padding:6px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;transition:all .15s;position:relative;}
    .cal-day:hover{background:var(--surface-2);border-color:var(--border);}
    .cal-day.today{background:var(--accent-lt);border-color:var(--accent);}
    .cal-day.other-month{opacity:.35;}
    .cal-day.selected{background:var(--primary-lt);border-color:var(--primary);}
    .cal-day-num{font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:4px;}
    .cal-day.today .cal-day-num{color:var(--accent-dk);font-weight:700;}
    .cal-event{font-size:10px;font-weight:600;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
    .cal-ev-agendado{background:var(--primary-lt);color:var(--primary-dk);}
    .cal-ev-realizado{background:var(--accent-lt);color:var(--accent-dk);}
    .cal-ev-cancelado{background:#FEF2F2;color:#DC2626;text-decoration:line-through;}
    .agenda-list{display:flex;flex-direction:column;gap:10px;}
    .agenda-item{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1.5px solid var(--border);display:flex;align-items:flex-start;gap:14px;box-shadow:var(--sh);cursor:pointer;transition:all .15s;}
    .agenda-item:hover{border-color:var(--primary);box-shadow:var(--sh-md);}

  return new Promise(res=>{

async function hashPIN(pin){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pin+'fisiovida_salt'));

}

      update();

        const h=await hashPIN(digits);
        if(h===prof.pin_hash){
          S.profAtual=prof;
          sessionStorage.setItem('profAtual',JSON.stringify(prof));
          closeMo();onSuccess();
        } else {
          document.getElementById('pin-err').textContent='PIN incorreto';
          digits='';update();
        }
      }
    });
  });
}

// ── GRÁFICO EVOLUÇÃO IA ──
async function gerarEvolucaoIA(){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');
  const sessoes=(pk?.sessoes||[]).filter(s=>s.avaliacao_ia?.resultado).sort((a,b)=>new Date(a.data_sessao)-new Date(b.data_sessao));
  if(sessoes.length<2){toast('Necessário pelo menos 2 sessões com avaliação IA','err');return;}

  // Usar scores já salvos se disponíveis (evita chamada extra à IA)
  const temScores=sessoes.every(s=>s.avaliacao_ia?.scores);
  if(temScores){
    const dadosProntos={
      sessoes:sessoes.map(s=>({n:s.numero_sessao,...s.avaliacao_ia.scores})),
      resumo:''
    };
    // Gerar só o resumo
    S.loadingEvolucao=true;S.evolucaoIA=dadosProntos;setTab('timeline');
    const{data:{session}}=await sb.auth.getSession();if(!session)return;
    try{
      const historico=sessoes.map(s=>'S'+s.numero_sessao+': '+s.avaliacao_ia.resultado).join(' | ');
      const r=await fetch(`${SUPA_URL}/functions/v1/ia-proxy`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({model:AI_MODEL,max_tokens:150,messages:[{role:'user',content:'Resuma em 60 palavras a evolução desta paciente de pós-op: '+historico}]})});
      const d=await r.json();
      dadosProntos.resumo=d.content?.[0]?.text||'';
      S.evolucaoIA={...dadosProntos};
    }catch{}
    S.loadingEvolucao=false;setTab('timeline');
    return;
  }

  // Fallback: pedir scores completos à IA
  S.loadingEvolucao=true;S.evolucaoIA=null;setTab('timeline');
  const{data:{session}}=await sb.auth.getSession();if(!session)return;
  const historico=sessoes.map(s=>'Sessão '+s.numero_sessao+' ('+fmtD(s.data_sessao)+'):\n'+s.avaliacao_ia.resultado).join('\n\n---\n\n');
  const prompt='Analise a evolução desta paciente de fisioterapia pós-operatória com base nas avaliações abaixo.\nRetorne APENAS um JSON válido (sem markdown) neste formato: {"sessoes":[{"n":1,"edema":3,"fibrose":4,"cicatriz":2}],"resumo":"até 60 palavras"}\nEscala: 1=ruim 5=ótimo.\nAvaliações:\n'+historico;
  try{
    const r=await fetch(`${SUPA_URL}/functions/v1/ia-proxy`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({model:AI_MODEL,max_tokens:512,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();if(!r.ok)throw new Error(d.error);
    const txt=d.content?.[0]?.text||'';
    S.evolucaoIA=JSON.parse(txt.replace(/```json?|```/g,'').trim());
  }catch(e){toast('Erro: '+e.message,'err');}
  S.loadingEvolucao=false;setTab('timeline');
}

function rGraficoEvolucao(){
  if(S.loadingEvolucao)return`<div class="evolucao-box"><div class="ai-loading" style="justify-content:center;padding:20px;color:var(--txt2)"><div class="ai-spin" style="border-color:rgba(79,160,212,.3);border-top-color:var(--primary)"></div> Analisando evolução…</div></div>`;
  if(!S.evolucaoIA)return'';
  const{sessoes,resumo}=S.evolucaoIA;
  if(!sessoes?.length)return'';
  const W=460,H=180,PAD={t:20,r:16,b:32,l:32};
  const iW=W-PAD.l-PAD.r,iH=H-PAD.t-PAD.b;
  const n=sessoes.length;
  const xS=(i)=>PAD.l+i*(iW/(Math.max(n-1,1)));
  const yS=(v)=>PAD.t+iH-((v-1)/(4))*iH;
  const line=(key,color)=>{
    const pts=sessoes.map((s,i)=>`${xS(i)},${yS(s[key]||1)}`).join(' ');
    const area=`M ${xS(0)},${yS(sessoes[0][key]||1)} `+sessoes.slice(1).map((s,i)=>`L ${xS(i+1)},${yS(s[key]||1)}`).join(' ')+` L ${xS(n-1)},${PAD.t+iH} L ${xS(0)},${PAD.t+iH} Z`;
    return`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${area}" fill="${color}" fill-opacity="0.08"/>
    ${sessoes.map((s,i)=>`<circle cx="${xS(i)}" cy="${yS(s[key]||1)}" r="3.5" fill="${color}" stroke="white" stroke-width="1.5"/>`).join('')}`;
  };
  const gridLines=[1,2,3,4,5].map(v=>`<line x1="${PAD.l}" y1="${yS(v)}" x2="${W-PAD.r}" y2="${yS(v)}" stroke="#E2DDE6" stroke-width="1" stroke-dasharray="3,3"/><text x="${PAD.l-6}" y="${yS(v)+4}" font-size="9" fill="#9AA5B4" text-anchor="end">${v}</text>`).join('');
  const xLabels=sessoes.map((s,i)=>`<text x="${xS(i)}" y="${H-6}" font-size="9" fill="#9AA5B4" text-anchor="middle">S${s.n}</text>`).join('');
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;overflow:visible">${gridLines}${xLabels}${line('edema','#4fa0d4')}${line('fibrose','#f59e0b')}${line('cicatriz','#95bb29')}</svg>`;
  return`<div class="evolucao-box">
    <div class="flex jb ai-c" style="margin-bottom:12px">
      <div class="card-t">📊 Análise de Evolução</div>
      <button class="btn btn-s btn-sm" onclick="S.evolucaoIA=null;setTab('timeline')">✕</button>
    </div>
    <div class="evol-legend">
      <div class="evol-leg-item"><div class="evol-leg-dot" style="background:#4fa0d4"></div>Edema</div>
      <div class="evol-leg-item"><div class="evol-leg-dot" style="background:#f59e0b"></div>Fibrose</div>
      <div class="evol-leg-item"><div class="evol-leg-dot" style="background:#95bb29"></div>Cicatrização</div>
    </div>
    ${svg}
    ${resumo?`<div class="evolucao-resumo">💬 ${resumo}</div>`:''}
  </div>`;
}

function bindSlider(){
  const wrap=document.getElementById('slw');
  const after=document.getElementById('sla');
  const handle=document.getElementById('slh');
  if(!wrap)return;
  let active=false;

  const move=clientX=>{
    const rect=wrap.getBoundingClientRect();
    const pct=Math.max(2,Math.min(98,(clientX-rect.left)/rect.width*100));
    handle.style.left=pct+'%';
    after.style.clipPath='inset(0 '+(100-pct)+'% 0 0)';
  };

  wrap.addEventListener('mousedown',e=>{active=true;move(e.clientX);e.preventDefault();});
  wrap.addEventListener('touchstart',e=>{active=true;move(e.touches[0].clientX);},{passive:true});
  window.addEventListener('mousemove',e=>{if(active)move(e.clientX);});
  window.addEventListener('touchmove',e=>{if(active){move(e.touches[0].clientX);e.preventDefault();}},{passive:false});
  window.addEventListener('mouseup',()=>active=false);
  window.addEventListener('touchend',()=>active=false);
}

async function gerarRelatorioAlta(){
  const p=S.pac;if(!p){toast('Nenhum paciente','err');return;}
  const a=p.anamnese?.[0]||{};
  const pk=p.pacotes?.find(pk=>pk.status==='ativo')||p.pacotes?.[p.pacotes.length-1];
  const sessoes=(pk?.sessoes||[]).sort((x,y)=>new Date(x.data_sessao)-new Date(y.data_sessao));
  const cor=corPDF();
  const cfgPDF=S.config.pdf_opts||{};
  toast('Gerando relatório de alta…');

  const content=[...pdfHeader('Relatório de Alta — Tratamento Concluído',cor)];

  // Faixa destacada
  content.push({table:{widths:['*'],body:[[{text:'✓ Pacote concluído com sucesso',fontSize:14,bold:true,color:'#fff',fillColor:cor,alignment:'center',margin:[0,12,0,12]}]]},layout:'noBorders',margin:[0,0,0,20]});

  // Dados do paciente
  content.push({text:p.nome,fontSize:20,bold:true,color:'#18181B',margin:[0,0,0,4]});
  content.push({columns:[
    a.tipo_cirurgia?{text:'✂ '+a.tipo_cirurgia,fontSize:11,color:'#52525B'}:{text:''},
    a.data_cirurgia?{text:'Cirurgia: '+fmtD(a.data_cirurgia),fontSize:11,color:'#52525B'}:{text:''},
    {text:'Total: '+sessoes.length+' sessões',fontSize:11,bold:true,color:cor}
  ],margin:[0,0,0,16]});

  // Período de tratamento
  if(sessoes.length){
    const ini=fmtD(sessoes[0].data_sessao),fim=fmtD(sessoes[sessoes.length-1].data_sessao);
    content.push({text:'Período do Tratamento',style:'sectionHd'});
    content.push({text:ini+' a '+fim,fontSize:12,color:'#52525B',margin:[0,0,0,12]});
  }

  // Evolução geral
  if(S.evolucaoIA?.resumo){
    content.push({text:'Evolução do Tratamento',style:'sectionHd'});
    content.push({text:S.evolucaoIA.resumo,fontSize:11,color:'#52525B',italics:true,margin:[0,0,0,8]});
    const imgGraf=graficoParaPDF(S.evolucaoIA);
    if(imgGraf)content.push({image:imgGraf,width:460,margin:[0,0,0,16]});
  }

  // Procedimentos mais realizados
  const contagem={};
  sessoes.forEach(s=>{(Array.isArray(s.procedimentos)?s.procedimentos:JSON.parse(s.procedimentos||'[]')).forEach(p=>{contagem[p]=(contagem[p]||0)+1;});});
  const topProcs=Object.entries(contagem).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(topProcs.length){
    content.push({text:'Principais Procedimentos',style:'sectionHd'});
    content.push({ul:topProcs.map(([p,n])=>p+' ('+n+'x)'),fontSize:11,color:'#52525B',margin:[0,0,0,16]});
  }

  // Última avaliação IA
  const ultimaIA=[...sessoes].reverse().find(s=>s.avaliacao_ia?.resultado);
  if(ultimaIA){
    content.push({text:'Avaliação Final da Cicatrização',style:'sectionHd'});
    content.push({text:ultimaIA.avaliacao_ia.resultado,fontSize:11,color:'#52525B',margin:[0,0,0,16]});
  }

  content.push(...pdfRodape(cor));
  const pgSize=cfgPDF.pagina||'A4';
  const margens=[cfgPDF.margem_h||40,cfgPDF.margem_v||40,cfgPDF.margem_h||40,cfgPDF.margem_v||60];
  previewPDF({pageSize:pgSize,pageMargins:margens,content,styles:pdfStyles(cor),defaultStyle:{font:'Roboto'}},
    'Alta_'+p.nome.replace(/\s+/g,'_')+'.pdf');
}

}
async function saveSessao(dados){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');
  if(!pk){toast('Nenhum pacote ativo','err');return null;}
  const n=(pk.sessoes?.length||0)+1;
  const anam=S.pac?.anamnese?.[0];
  const fase=calcFase(anam?.data_cirurgia,dados.data_sessao)?.cls||'f3';
  const rows=await q(()=>sb.from('sessoes').insert({...dados,pacote_id:pk.id,paciente_id:S.pac.id,numero_sessao:n,fase_cicatrizacao:fase.replace('f','fase-'),created_at:new Date().toISOString()}).select());
  const sessao=rows?.[0];if(!sessao)return null;
  for(let i=0;i<S.fotos.length;i++){
    const blob=await compImg(S.fotos[i]);const path=`sessoes/${sessao.id}/${Date.now()}_${i}.jpg`;
    const{error:upErr}=await sb.storage.from('fisiovida').upload(path,blob,{contentType:'image/jpeg'});
    if(!upErr){
      const{data:ud}=sb.storage.from('fisiovida').getPublicUrl(path);
      const regiao=S.fotosRegioes?.[i]||null;
      await q(()=>sb.from('fotos_sessao').insert({sessao_id:sessao.id,url:ud.publicUrl,ordem:i,referencia_escala:regiao}));
    }
  }
  toast(`Sessão ${n} registrada`,'ok');S.fotos=[];S.fotosRegioes=[];return sessao;
}

// ── AGENDA ──
async function loadAgenda(){
  S.agenda=await q(()=>sb.from('agenda').select('*,pacientes(nome)').eq('user_id',S.user.id).order('data').order('hora_inicio'))||[];
}
function verificarConflito(data,hIni,hFim,excId=null){
  if(!hIni)return[];
  const toMin=h=>{const[hh,mm]=h.split(':').map(Number);return hh*60+mm;};
  const novoIni=toMin(hIni),novoFim=hFim?toMin(hFim):novoIni+60;
  return S.agenda.filter(e=>{
    if(e.id===excId||e.data!==data||!e.hora_inicio||e.status==='cancelado')return false;
    const eIni=toMin(e.hora_inicio),eFim=e.hora_fim?toMin(e.hora_fim):eIni+60;
    return eIni<novoFim&&eFim>novoIni;
  });
}

function gerarSerie(dados,{freq,reps,diasSemana}){
  const evs=[],base=new Date(dados.data+'T12:00:00');
  let cur=new Date(base),count=0,maxDays=120;
  while(count<reps&&maxDays-->0){
    const dow=cur.getDay();
    const ok=freq==='diaria'||(freq==='semanal'&&diasSemana.includes(dow));
    if(ok){evs.push({...dados,data:cur.toISOString().split('T')[0]});count++;}
    cur.setDate(cur.getDate()+1);
  }
  return evs;
}

async function saveEvento(dados,serie=null){
  if(dados.id){
    await q(()=>sb.from('agenda').update(dados).eq('id',dados.id));
    toast('Evento atualizado','ok');
  } else if(serie){
    const evs=gerarSerie(dados,serie);
    for(const ev of evs) await q(()=>sb.from('agenda').insert({...ev,user_id:S.user.id}));
    toast(`${evs.length} eventos criados`,'ok');
  } else {
    await q(()=>sb.from('agenda').insert({...dados,user_id:S.user.id}));
    toast('Evento criado','ok');
  }
  await loadAgenda();
}

}
async function updateStatus(id,status){

function agendaHoje(){

function agendaMes(ano,mes){

async function avaliarIA(notas){
  const anam=S.pac?.anamnese?.[0],fase=calcFase(anam?.data_cirurgia);
  const{data:{session}}=await sb.auth.getSession();
  if(!session)throw new Error('Sessão expirada.');
  const tmpl=S.config.prompt_avaliacao||DEFAULT_PROMPT;
  const prompt=tmpl.replace('{{tipo_cirurgia}}',anam?.tipo_cirurgia||'não informado').replace('{{data_cirurgia}}',fmtD(anam?.data_cirurgia)).replace('{{fase}}',fase?`${fase.nome} (D${fase.dias})`:'não calculada').replace('{{cirurgiao}}',anam?.cirurgiao||'não informado').replace('{{historico}}',anam?.historico||'—').replace('{{contraindicacoes}}',anam?.contraindicacoes||'nenhuma').replace('{{notas}}',notas||'—');
  const content=[];
  for(const f of S.fotos.slice(0,3)){try{content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await img64(f)}});}catch{}}
  content.push({type:'text',text:prompt});
  const r=await fetch(`${SUPA_URL}/functions/v1/ia-proxy`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({model:AI_MODEL,max_tokens:1024,messages:[{role:'user',content}]})});
  const d=await r.json();if(!r.ok)throw new Error(d.error||`Erro ${r.status}`);
  return d.content?.[0]?.text||'Sem resultado.';
}

// ── FOTO PARA BASE64 (para PDF) ──
async function fotoParaBase64(url){
  try{
    const r=await fetch(url);
    const blob=await r.blob();
    return new Promise(res=>{
      const reader=new FileReader();
      reader.onload=()=>res(reader.result);
      reader.readAsDataURL(blob);
    });
  }catch{return null;}
}

async function fotosParaPDF(sessoes,cfgPDF){
  if(cfgPDF?.incluir_fotos===false) return {};
  const mapa={};
  for(const s of sessoes){
    const fotos=s.fotos_sessao||[];
    if(!fotos.length)continue;
    mapa[s.id]=[];
    for(const f of fotos.slice(0,4)){// máx 4 por sessão
      const b64=await fotoParaBase64(f.url);
      if(b64)mapa[s.id].push({b64,regiao:f.referencia_escala||''});
    }
  }
  return mapa;
}


// ── MARKDOWN PARSER ──
function mdHTML(text){
  if(!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/^#{1,3} (.+)$/gm,'<div style="font-weight:700;font-size:14px;margin:8px 0 4px;color:#fff">$1</div>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
    .replace(/^[-•–] (.+)$/gm,'<div style="padding-left:12px;margin:3px 0">· $1</div>')
    .replace(/\n\n/g,'<br><br>')
    .replace(/\n/g,'<br>');
}

function parseBoldPDF(text, fs, baseColor){
  const parts=[];
  const re=/\*\*([^*]+)\*\*/g;
  let last=0, m;
  while((m=re.exec(text))!==null){
    if(m.index>last) parts.push({text:text.slice(last,m.index),fontSize:fs,color:baseColor||'#4A5568'});
    parts.push({text:m[1],fontSize:fs,bold:true,color:baseColor||'#1A1D2E'});
    last=m.index+m[0].length;
  }
  if(last<text.length) parts.push({text:text.slice(last),fontSize:fs,color:baseColor||'#4A5568'});
  return parts.length===1?parts[0]:parts.length?parts:{text:text,fontSize:fs};
}

function mdPDF(text, fs){
  if(!text) return [];
  const lines=text.split('\n');
  const result=[];
  let ulBuffer=[];

  const flushUL=()=>{
    if(!ulBuffer.length) return;
    result.push({ul:ulBuffer,fontSize:fs-1,color:'#4A5568',margin:[0,2,0,6]});
    ulBuffer=[];
  };

  for(const raw of lines){
    const line=raw.trim();
    if(!line){flushUL();result.push({text:' ',margin:[0,2,0,2]});continue;}

    // Título ## ou #
    if(/^#{1,3} /.test(line)){
      flushUL();
      const lvl=(line.match(/^#+/)||[''])[0].length;
      const txt=line.replace(/^#+\s*/,'');
      result.push({text:txt,fontSize:fs+(lvl===1?3:lvl===2?2:1),bold:true,color:'#1A1D2E',margin:[0,10,0,4]});
      continue;
    }
    // Item de lista
    if(/^[-•*–]\s/.test(line)){
      ulBuffer.push(parseBoldPDF(line.replace(/^[-•*–]\s/,''),fs-1));
      continue;
    }
    // Linha normal
    flushUL();
    result.push({text:parseBoldPDF(line,fs),lineHeight:1.5,margin:[0,1,0,1]});
  }
  flushUL();
  return result;
}

// ── GRÁFICO PARA PDF (Canvas → PNG base64) ──
function graficoParaPDF(dados){
  if(!dados?.sessoes?.length) return null;
  const {sessoes} = dados;
  const W=500, H=200, P={t:24,r:20,b:36,l:40};
  const iW=W-P.l-P.r, iH=H-P.t-P.b;
  const n=sessoes.length;
  const xS=i=>P.l+i*(iW/Math.max(n-1,1));
  const yS=v=>P.t+iH-((v-1)/4)*iH;

  const c=document.createElement('canvas');
  c.width=W*2; c.height=H*2;
  const ctx=c.getContext('2d');
  ctx.scale(2,2);

  // Fundo branco
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,W,H);

  // Grid e labels Y
  ctx.strokeStyle='#E2DDE6'; ctx.lineWidth=0.8;
  ctx.font='9px sans-serif'; ctx.fillStyle='#9AA5B4'; ctx.textAlign='right';
  [1,2,3,4,5].forEach(v=>{
    ctx.beginPath(); ctx.moveTo(P.l, yS(v)); ctx.lineTo(W-P.r, yS(v)); ctx.stroke();
    ctx.fillText(v, P.l-5, yS(v)+3);
  });

  // Labels X
  ctx.textAlign='center'; ctx.font='9px sans-serif'; ctx.fillStyle='#9AA5B4';
  sessoes.forEach((s,i)=>ctx.fillText('S'+s.n, xS(i), H-8));

  // Linhas
  const series=[
    {key:'edema',   color:'#4fa0d4', label:'Edema'},
    {key:'fibrose', color:'#f59e0b', label:'Fibrose'},
    {key:'cicatriz',color:'#95bb29', label:'Cicatrização'}
  ];

  series.forEach(({key,color})=>{
    // Área
    ctx.beginPath();
    ctx.moveTo(xS(0), yS(sessoes[0][key]||1));
    sessoes.slice(1).forEach((s,i)=>ctx.lineTo(xS(i+1), yS(s[key]||1)));
    ctx.lineTo(xS(n-1), P.t+iH);
    ctx.lineTo(xS(0), P.t+iH);
    ctx.closePath();
    ctx.fillStyle=color+'18';
    ctx.fill();

    // Linha
    ctx.beginPath();
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.lineJoin='round';
    sessoes.forEach((s,i)=>{
      if(i===0) ctx.moveTo(xS(i), yS(s[key]||1));
      else ctx.lineTo(xS(i), yS(s[key]||1));
    });
    ctx.stroke();

    // Pontos
    sessoes.forEach((s,i)=>{
      ctx.beginPath();
      ctx.arc(xS(i), yS(s[key]||1), 3.5, 0, Math.PI*2);
      ctx.fillStyle=color; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
    });
  });

  // Legenda
  let lx=P.l;
  const ly=10;
  series.forEach(({color,label})=>{
    ctx.beginPath(); ctx.arc(lx+4, ly+4, 4, 0, Math.PI*2);
    ctx.fillStyle=color; ctx.fill();
    ctx.fillStyle='#52525B'; ctx.font='bold 9px sans-serif'; ctx.textAlign='left';
    ctx.fillText(label, lx+12, ly+8);
    lx+=60;
  });

  return c.toDataURL('image/png');
}

// ── ROUTER ──
function nav(view,params={}){
  S.view=view;S.params=params;
  // Salvar no hash para sobreviver ao reload
  let hash=view;
  if(view==='paciente'&&S.pac?.id) hash='paciente/'+S.pac.id+'/'+S.tab;
  else if(view==='sessao'&&S.pac?.id) hash='sessao/'+S.pac.id;
  else if(view==='agenda') hash='agenda/'+S.agView;
  history.replaceState(null,'','#'+hash);
  render();
  window.scrollTo(0,0);
}

function rLogin(){return`<div class="login-pg"><div class="login-bg"></div><div class="login-card">

function bindLogin(){
  const btn=document.getElementById('lbtn');
  const doLogin=async()=>{
    const email=document.getElementById('lemail').value.trim(),pw=document.getElementById('lsnh').value;
    const err=document.getElementById('lerr');err.style.display='none';
    if(!email||!pw){err.textContent='Preencha e-mail e senha.';err.style.display='block';return;}
    btn.textContent='Entrando…';btn.disabled=true;
    try{await login(email,pw);}catch{err.textContent='E-mail ou senha incorretos.';err.style.display='block';btn.textContent='Entrar';btn.disabled=false;}
  };
  btn?.addEventListener('click',doLogin);
  document.getElementById('lsnh')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

function setAgView(v){
  S.agView=v;

  if(el){el.innerHTML=rAgContent();bindAgendaEvts();}
  document.querySelectorAll('.ag-tab').forEach(t=>{
    const map={hoje:'Hoje',semana:'Semana',mes:'Mês'};
    t.classList.toggle('active',t.textContent===map[v]);

function rAgContent(){
  if(S.agView==='hoje')return rHoje();
  if(S.agView==='semana')return rSemana();
  return rMes();
}

function rHoje(){
  const hoje=new Date().toISOString().split('T')[0];
  const evs=S.agenda.filter(e=>e.data===hoje).sort((a,b)=>(a.hora_inicio||'').localeCompare(b.hora_inicio||''));
  if(!evs.length)return`<div class="hoje-empty">
    <div class="hoje-empty-icon">📅</div>
    <div style="font-size:15px;font-weight:600;color:var(--txt2)">Nenhum evento hoje</div>
    <div style="font-size:13px;color:var(--txt3);margin-top:4px">Clique em "+ Novo Evento" para agendar</div>
  </div>`;
  return`<div class="hoje-resumo">${evs.map(e=>rAgendaItem(e,true)).join('')}</div>`;
}

function rSemana(){
  // Calcular dias da semana atual + offset
  const hoje=new Date();
  const dom=new Date(hoje);
  dom.setDate(hoje.getDate()-hoje.getDay()+(S.semanaOffset*7));
  const dias=Array.from({length:7},(_,i)=>{
    const d=new Date(dom);d.setDate(dom.getDate()+i);return d;
  });
  const hojeStr=hoje.toISOString().split('T')[0];
  const semStr=`${fmtD(dias[0].toISOString().split('T')[0])} — ${fmtD(dias[6].toISOString().split('T')[0])}`;
  const HORAS=Array.from({length:12},(_,i)=>i+8); // 8h–19h
  const PX_HORA=48;

  let heads=`<div class="week-head" style="border-bottom:1px solid var(--border)"></div>`;
  dias.forEach(d=>{
    const dStr=d.toISOString().split('T')[0];
    const isHoje=dStr===hojeStr;
    const dow=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];
    heads+=`<div class="week-head ${isHoje?'hoje-col':''}">${dow}<br><span style="font-size:14px;font-weight:700">${d.getDate()}</span></div>`;
  });

  let rows='';
  HORAS.forEach(h=>{
    rows+=`<div class="week-time-col">${padZ(h)}h</div>`;
    dias.forEach(d=>{
      const dStr=d.toISOString().split('T')[0];
      const isHoje=dStr===hojeStr;
      const evsDia=S.agenda.filter(e=>e.data===dStr);
      // Renderizar eventos que iniciam nesta hora
      const evsHora=evsDia.filter(e=>{
        if(!e.hora_inicio)return false;
        return parseInt(e.hora_inicio.split(':')[0])===h;
      });
      let evsHtml=evsHora.map(e=>{
        const [eh,em]=e.hora_inicio.split(':').map(Number);
        const top=(em/60)*PX_HORA;
        let dur=60;
        if(e.hora_fim){const[fh,fm]=e.hora_fim.split(':').map(Number);dur=Math.max(30,(fh*60+fm)-(eh*60+em));}
        const height=Math.max(24,(dur/60)*PX_HORA-2);
        const pac=e.pacientes?.nome?e.pacientes.nome.split(' ')[0]:'';
        return`<div class="week-ev week-ev-${e.status}" style="top:${top}px;height:${height}px" onclick="verEvento('${e.id}')" title="${e.titulo}${pac?' — '+pac:''}">
          ${fmtH(e.hora_inicio)} ${e.titulo}${pac?`<br><span style="opacity:.7">${pac}</span>`:''}
        </div>`;
      }).join('');
      rows+=`<div class="week-col ${isHoje?'hoje-col':''}"><div class="week-slot">${evsHtml}</div></div>`;
    });
  });

  return`<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
    <button class="btn btn-s btn-sm" onclick="navSemana(-1)">←</button>
    <span style="font-size:14px;font-weight:600;color:var(--txt2)">${semStr}</span>
    <button class="btn btn-s btn-sm" onclick="navSemana(1)">→</button>
    ${S.semanaOffset!==0?`<button class="btn btn-g btn-sm" onclick="navSemana(0,true)">Hoje</button>`:''}
  </div>
  <div class="week-wrap">
    <div class="week-grid">${heads}${rows}</div>
  </div>`;
}

function rMes(){
  const hoje=new Date();
  const diasMes=new Date(S.calAno,S.calMes+1,0).getDate();
  const primeiroDia=new Date(S.calAno,S.calMes,1).getDay();
  const eventosMes=agendaMes(S.calAno,S.calMes);
  const hojeStr=`${hoje.getFullYear()}-${padZ(hoje.getMonth()+1)}-${padZ(hoje.getDate())}`;
  const diaSelStr=S.calDiaSel?`${S.calAno}-${padZ(S.calMes+1)}-${padZ(S.calDiaSel)}`:null;
  const eventosdia=diaSelStr?S.agenda.filter(e=>e.data===diaSelStr):[];

  let cells='';
  DIAS_SEMANA.forEach(d=>{cells+=`<div class="cal-dow">${d}</div>`;});
  for(let i=0;i<primeiroDia;i++){
    const dAnt=new Date(S.calAno,S.calMes,0-primeiroDia+i+1);
    cells+=`<div class="cal-day other-month"><div class="cal-day-num">${dAnt.getDate()}</div></div>`;
  }
  for(let d=1;d<=diasMes;d++){
    const dStr=`${S.calAno}-${padZ(S.calMes+1)}-${padZ(d)}`;
    const evs=eventosMes.filter(e=>e.data===dStr);
    const isHoje=dStr===hojeStr,isSel=S.calDiaSel===d;
    cells+=`<div class="cal-day ${isHoje?'today':''} ${isSel?'selected':''}" onclick="selDia(${d})">
      <div class="cal-day-num">${d}</div>
      ${evs.slice(0,2).map(e=>`<div class="cal-event cal-ev-${e.status}" onclick="event.stopPropagation();verEvento('${e.id}')">${e.hora_inicio?fmtH(e.hora_inicio)+' ':''} ${e.titulo}</div>`).join('')}
      ${evs.length>2?`<div style="font-size:10px;color:var(--txt3)">+${evs.length-2}</div>`:''}
    </div>`;
  }
  const total=primeiroDia+diasMes;const resto=(7-total%7)%7;
  for(let i=1;i<=resto;i++){cells+=`<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;}

  return`<div style="display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start">
    <div class="card">
      <div class="cal-header">
        <button class="btn btn-g btn-sm" onclick="navMes(-1)">←</button>
        <div class="cal-month">${MESES[S.calMes]} ${S.calAno}</div>
        <button class="btn btn-g btn-sm" onclick="navMes(1)">→</button>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
    <div>
      ${diaSelStr?`<div class="card" style="margin-bottom:14px">
        <div class="card-hd" style="margin-bottom:12px">
          <div class="card-t">${padZ(S.calDiaSel)}/${padZ(S.calMes+1)} — ${eventosdia.length} evento(s)</div>
          <button class="btn btn-acc btn-sm" onclick="modalNovoEvento('${diaSelStr}')">+</button>
        </div>
        ${eventosdia.length===0?`<div style="text-align:center;padding:20px;color:var(--txt3);font-size:13px">Nenhum evento neste dia</div>`:`<div class="hoje-resumo">${eventosdia.map(e=>rAgendaItem(e)).join('')}</div>`}
      </div>`:''}
      <div class="card">
        <div class="card-t" style="margin-bottom:12px">Próximos eventos</div>
        <div class="hoje-resumo">
          ${S.agenda.filter(e=>e.data>=hojeStr&&e.status==='agendado').slice(0,5).map(e=>`
            <div class="agenda-item" onclick="verEvento('${e.id}')">
              <div class="agenda-hora">${fmtH(e.hora_inicio)}<span>${fmtD(e.data)}</span></div>
              <div class="agenda-info"><div class="agenda-titulo">${e.titulo}</div>${e.pacientes?.nome?`<div class="agenda-pac">${e.pacientes.nome}</div>`:''}</div>
            </div>`).join('')||`<div style="text-align:center;padding:16px;color:var(--txt3);font-size:13px">Nenhum evento futuro</div>`}
        </div>
      </div>
    </div>
  </div>`;
}
// ── PACIENTE HUB ──
function rPac(){
  const p=S.pac;if(!p)return'<div style="padding:40px">Paciente não encontrado.</div>';
  const a=p.anamnese?.[0]||{},pk=p.pacotes?.find(pk=>pk.status==='ativo');
  const sessoes=pk?.sessoes||[],feitas=sessoes.length,total=pk?.total_sessoes||0;
  const pct=total>0?Math.round((feitas/total)*100):0,fase=calcFase(a.data_cirurgia);

function setTab(t){
  S.tab=t;const el=document.getElementById('tc2');
  if(el){el.innerHTML=rTab();bindTabEvts();}
  document.querySelectorAll('.tab').forEach(el=>{const map={timeline:'Linha',dados:'Dados',anamnese:'Anamnese',pacote:'Pacote'};el.classList.toggle('active',el.textContent.includes(map[t]||t));});
  // Atualizar hash com aba atual
  if(S.pac?.id) history.replaceState(null,'','#paciente/'+S.pac.id+'/'+t);
}
function rTab(){switch(S.tab){case'timeline':return rTimeline();case'dados':return rDados();case'anamnese':return rAnam();case'pacote':return rPkTab();default:return'';}}

function rTimeline(){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');
  const all=(pk?.sessoes||[]).sort((a,b)=>new Date(a.data_sessao)-new Date(b.data_sessao));
  if(!all.length)return`<div class="tl-empty"><div style="font-size:48px;margin-bottom:14px">🌱</div><div style="font-size:16px;font-weight:600;color:var(--txt2)">Jornada ainda não iniciada</div><div style="font-size:13px;color:var(--txt3);margin-top:4px">Registre a primeira sessão para começar a linha do tempo</div><button class="btn btn-p mt16" onclick="nav('sessao')">+ Primeira Sessão</button></div>`;
  const sessComIA=all.filter(s=>s.avaliacao_ia?.resultado);
  const btnEvolucao=sessComIA.length>=2?`<div class="flex jb ai-c" style="margin-bottom:16px"><div></div><button class="btn btn-s btn-sm" onclick="gerarEvolucaoIA()">📊 Análise de Evolução</button></div>`:'';
  const grafico=rGraficoEvolucao();
  const por={'fase-1':[],'fase-2':[],'fase-3':[]};all.forEach(s=>{(por[s.fase_cicatrizacao]||por['fase-3']).push(s);});
  const labels={'fase-1':{cor:'var(--f1)',nm:'🔴 Fase Inflamatória',sub:'D0 — D5'},'fase-2':{cor:'var(--f2)',nm:'🟡 Fase Proliferativa',sub:'D6 — D21'},'fase-3':{cor:'var(--f3)',nm:'🟢 Fase de Remodelamento',sub:'D22+'}};
  let h=btnEvolucao+grafico+'<div class="timeline">';
  ['fase-1','fase-2','fase-3'].forEach(f=>{
    const its=por[f];if(!its.length)return;const lb=labels[f];
    h+=`<div class="tl-phase"><div class="tl-phase-dot" style="background:${lb.cor}"></div><span style="font-size:14px;font-weight:700;color:${lb.cor}">${lb.nm}</span><span style="font-size:12px;color:var(--txt3);margin-left:6px">${lb.sub}</span></div>`;
    its.forEach(s=>{
      const procs=Array.isArray(s.procedimentos)?s.procedimentos:JSON.parse(s.procedimentos||'[]');
      const fotos=s.fotos_sessao||[];
      h+=`<div class="tl-item" onclick="verSessao('${s.id}')"><div class="tl-dot tl-dot-${f.replace('fase-','f')}"></div><div class="tl-card"><div class="tl-card-hd"><div class="tl-card-t">Sessão ${s.numero_sessao}</div><div class="tl-card-d">${fmtD(s.data_sessao)}</div></div>${procs.length?`<div class="tl-procs">${procs.map(p=>`<span class="proc-tag">${p}</span>`).join('')}</div>`:''} ${s.notas?`<div style="font-size:12px;color:var(--txt2);line-height:1.5">${s.notas.substring(0,120)}${s.notas.length>120?'…':''}</div>`:''} ${fotos.length?`<div class="tl-photos">${fotos.map(f=>`<img class="tl-photo" src="${f.url}" loading="lazy">`).join('')}</div>`:''}</div></div>`;
    });
  });
  h+='</div>';return h;
}
function rDados(){const p=S.pac;return`<div class="card"><div class="card-hd"><div class="card-t">Dados Pessoais</div><button class="btn btn-s btn-sm" onclick="modalEditPac()">Editar</button></div><div class="dr"><span class="dr-lbl">Nome</span><span class="dr-val">${p.nome}</span></div><div class="dr"><span class="dr-lbl">Nascimento</span><span class="dr-val">${fmtD(p.data_nascimento)}</span></div><div class="dr"><span class="dr-lbl">Telefone</span><span class="dr-val">${p.telefone||'—'}</span></div><div class="dr"><span class="dr-lbl">E-mail</span><span class="dr-val">${p.email||'—'}</span></div></div>`;}

function modalNovoEvento(dataDefault='',pacDefault=''){
  const pacs=S.pacientes;
  const hoje=new Date().toISOString().split('T')[0];
  modal(`<div class="mo-box"><div class="mo-hd"><div class="mo-t">Novo Evento</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div id="conflito-warn-area"></div>
    <div class="fg"><label class="fl">Título *</label><input class="fi" id="etit" placeholder="Ex: Sessão de drenagem linfática"></div>
    <div class="fg3">
      <div class="fg"><label class="fl">Data</label><input class="fi" type="date" id="edata" value="${dataDefault||hoje}"></div>
      <div class="fg"><label class="fl">Início</label><input class="fi" type="time" id="einicio" value="09:00"></div>
      <div class="fg"><label class="fl">Fim</label><input class="fi" type="time" id="efim" value="10:00"></div>
    </div>
    <div class="fg"><label class="fl">Paciente (opcional)</label>
      <select class="fsel" id="epac"><option value="">Sem vínculo</option>${pacs.map(p=>`<option value="${p.id}" ${p.id===pacDefault?'selected':''}>${p.nome}</option>`).join('')}</select>
    </div>
    <div class="fg"><label class="fl">Observações</label><textarea class="fta" id="eobs" style="min-height:64px"></textarea></div>
    <div class="fg" style="background:var(--surface-2);border-radius:var(--r-sm);padding:12px;border:1px solid var(--border)">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600">
        <input type="checkbox" id="erec" style="width:16px;height:16px;accent-color:var(--accent)"> Repetir evento
      </label>
      <div id="rec-opts" style="display:none;margin-top:12px">
        <div class="fg2">
          <div class="fg" style="margin-bottom:0">
            <label class="fl">Frequência</label>
            <select class="fsel" id="efreq">
              <option value="diaria">Diária</option>
              <option value="semanal" selected>Semanal</option>
            </select>
          </div>
          <div class="fg" style="margin-bottom:0">
            <label class="fl">Repetições</label>
            <input class="fi" type="number" id="ereps" value="10" min="2" max="50">
          </div>
        </div>
        <div id="dias-semana" style="margin-top:10px">
          <label class="fl">Dias da semana</label>
          <div class="rec-days">
            ${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d,i)=>`<div class="rec-day ${i>=1&&i<=5?'sel':''}" data-dow="${i}">${d}</div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="flex gap8 mt16">
      <button class="btn btn-p" id="cev" style="flex:1;justify-content:center">Criar</button>
      <button class="btn btn-s" onclick="closeMo()">Cancelar</button>
    </div>
  </div>`);

  // Toggle recorrência
  document.getElementById('erec').addEventListener('change',e=>{
    document.getElementById('rec-opts').style.display=e.target.checked?'block':'none';
  });
  document.getElementById('efreq').addEventListener('change',e=>{
    document.getElementById('dias-semana').style.display=e.target.value==='semanal'?'block':'none';
  });
  document.querySelectorAll('.rec-day').forEach(el=>{
    el.addEventListener('click',()=>el.classList.toggle('sel'));
  });

  // Verificar conflito ao mudar data/hora
  const checkConflito=()=>{
    const data=document.getElementById('edata').value;
    const ini=document.getElementById('einicio').value;
    const fim=document.getElementById('efim').value;
    const area=document.getElementById('conflito-warn-area');
    if(!area)return;
    const conflitos=verificarConflito(data,ini,fim);
    area.innerHTML=conflitos.length?`<div class="conflito-warn">⚠ Conflito com "${conflitos[0].titulo}" às ${fmtH(conflitos[0].hora_inicio)}</div>`:'';
  };
  document.getElementById('edata').addEventListener('change',checkConflito);
  document.getElementById('einicio').addEventListener('change',checkConflito);
  document.getElementById('efim').addEventListener('change',checkConflito);

  document.getElementById('cev').addEventListener('click',async()=>{
    const titulo=document.getElementById('etit').value.trim();
    if(!titulo){toast('Título obrigatório','err');return;}
    const dados={titulo,data:document.getElementById('edata').value,hora_inicio:document.getElementById('einicio').value||null,hora_fim:document.getElementById('efim').value||null,paciente_id:document.getElementById('epac').value||null,observacoes:document.getElementById('eobs').value.trim()||null,status:'agendado'};
    const isRec=document.getElementById('erec').checked;
    let serie=null;
    if(isRec){
      const freq=document.getElementById('efreq').value;
      const reps=parseInt(document.getElementById('ereps').value)||10;
      const diasSel=freq==='semanal'?Array.from(document.querySelectorAll('.rec-day.sel')).map(e=>parseInt(e.dataset.dow)):[0,1,2,3,4,5,6];
      serie={freq,reps,diasSemana:diasSel};
    }
    try{await saveEvento(dados,serie);closeMo();render();}
    catch(e){toast('Erro: '+e.message,'err');}
  });
}

async function updEvSt(id,status){await updateStatus(id,status);render();}

function confirmar(msg, onConfirm, danger=true){
  modal(`<div class="mo-box" style="max-width:380px;text-align:center">
    <div style="font-size:36px;margin-bottom:16px">${danger?'⚠️':'❓'}</div>

    <div class="flex gap8 mt24" style="justify-content:center">
      <button class="btn btn-s" onclick="closeMo()">Cancelar</button>
      <button class="btn" style="background:${danger?'#DC2626':'var(--primary)'};color:#fff" id="cbtn">Confirmar</button>
    </div>
  </div>`);
  document.getElementById('cbtn')?.addEventListener('click',()=>{closeMo();onConfirm();});
}

async function editarSessao(id){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');
  const s=pk?.sessoes?.find(s=>s.id===id);if(!s)return;
  const procs=Array.isArray(s.procedimentos)?s.procedimentos:JSON.parse(s.procedimentos||'[]');
  modal(`<div class="mo-box" style="max-width:560px">
    <div class="mo-hd"><div class="mo-t">Editar Sessão ${s.numero_sessao}</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div class="fg"><label class="fl">Data</label><input class="fi" type="date" id="es-data" value="${s.data_sessao}" style="max-width:200px"></div>
    <div class="fg"><label class="fl">Procedimentos</label>
      <div class="proc-grid">
        ${PROCS.map(p=>`<label class="proc-check"><input type="checkbox" value="${p}" ${procs.includes(p)?'checked':''}><div class="proc-chk-dot"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg></div>${p}</label>`).join('')}
      </div>
    </div>
    <div class="fg"><label class="fl">Notas</label><textarea class="fta" id="es-notas" style="min-height:100px">${s.notas||''}</textarea></div>
    <div class="flex gap8 mt8">
      <button class="btn btn-p" id="es-salvar" style="flex:1;justify-content:center">Salvar</button>
      <button class="btn btn-s" onclick="closeMo()">Cancelar</button>
    </div>
  </div>`);
  document.getElementById('es-salvar')?.addEventListener('click',async()=>{
    const procs2=Array.from(document.querySelectorAll('.proc-check input:checked')).map(e=>e.value);
    try{
      await q(()=>sb.from('sessoes').update({data_sessao:document.getElementById('es-data').value,procedimentos:procs2,notas:document.getElementById('es-notas').value.trim()}).eq('id',id));
      toast('Sessão atualizada','ok');closeMo();await loadPac(S.pac.id);setTab('timeline');
    }catch(e){toast('Erro: '+e.message,'err');}
  });
}

async function excluirSessao(id){
  confirmar('Excluir esta sessão permanentemente?',async()=>{
    try{
      await q(()=>sb.from('fotos_sessao').delete().eq('sessao_id',id));
      await q(()=>sb.from('sessoes').delete().eq('id',id));
      toast('Sessão excluída','ok');await loadPac(S.pac.id);setTab('timeline');
    }catch(e){toast('Erro: '+e.message,'err');}
  });
}

function verSessao(id){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');const s=pk?.sessoes?.find(s=>s.id===id);if(!s)return;
  const procs=Array.isArray(s.procedimentos)?s.procedimentos:JSON.parse(s.procedimentos||'[]');const fotos=s.fotos_sessao||[];
  const fLabel={'fase-1':'🔴 Inflamatória','fase-2':'🟡 Proliferativa','fase-3':'🟢 Remodelamento'};const fCls={'fase-1':'f1','fase-2':'f2','fase-3':'f3'};const fc=s.fase_cicatrizacao||'fase-3';
  const sensivelOk=temAcessoSensivel();
  const bloqueio=`<div class="sensivel-lock" onclick="closeMo();pedirAcessoSensivel()">🔒 Dados restritos — clique para desbloquear</div>`;
  modal(`<div class="mo-box" style="max-width:640px"><div class="mo-hd"><div class="mo-t">Sessão ${s.numero_sessao}</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div class="flex gap8 ai-c" style="margin-bottom:18px"><span class="badge b-${fCls[fc]}">${fLabel[fc]||fc}</span><span style="font-size:13px;color:var(--txt3)">${fmtD(s.data_sessao)}</span></div>
    ${procs.length?`<div class="sec-t" style="margin-bottom:10px">Procedimentos</div><div class="tl-procs" style="margin-bottom:18px">${procs.map(p=>`<span class="proc-tag">${p}</span>`).join('')}</div>`:''}
    ${s.notas&&sensivelOk?`<div class="sec-t" style="margin-bottom:8px">Evolução</div><div style="font-size:14px;color:var(--txt2);line-height:1.65;white-space:pre-wrap;margin-bottom:18px">${s.notas}</div>`:''}
    ${s.avaliacao_ia?.resultado?(sensivelOk?`<div class="sec-t" style="margin-bottom:8px">✦ Avaliação de Cicatrização (IA)</div><div style="background:var(--primary-lt);border-radius:var(--r-sm);padding:14px;font-size:13px;line-height:1.65;color:var(--primary-dk);white-space:pre-wrap;margin-bottom:18px">${s.avaliacao_ia.resultado}</div>`:bloqueio):''}
    ${fotos.length?(sensivelOk?`<div class="sec-t" style="margin-bottom:10px">📸 Fotos</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">${fotos.map(f=>`<img src="${f.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)" title="${f.referencia_escala||''}">`).join('')}</div>`:bloqueio):''}
    <div class="flex gap8 mt16">
      <button class="btn btn-s btn-sm" onclick="closeMo();editarSessao('${s.id}')">✏ Editar</button>
      <button class="btn btn-sm" style="background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;margin-left:auto" onclick="closeMo();excluirSessao('${s.id}')">🗑 Excluir</button>
    </div>
  </div>`);
}

function bindAll(){bindDash();bindAgendaEvts();bindSessEvts();bindCfgEvts();bindTabEvts();}

function bindDash(){
  document.getElementById('bnp')?.addEventListener('click',()=>{S.pac=null;modalNovoPac();});
  document.getElementById('busca')?.addEventListener('input',e=>{
    const q2=e.target.value.toLowerCase(),pg=document.getElementById('pg');if(!pg)return;
    const fs=S.pacientes.filter(p=>{const a=p.anamnese?.[0];return p.nome.toLowerCase().includes(q2)||(a?.tipo_cirurgia||'').toLowerCase().includes(q2);});
    pg.innerHTML=fs.length?fs.map(rPacCard).join(''):'<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--txt3)">Nenhum paciente encontrado</div>';
  });
}

function bindAgendaEvts(){
  document.getElementById('bne')?.addEventListener('click',()=>modalNovoEvento());
}
function navSemana(d,reset=false){

function bindTabEvts(){
  document.getElementById('bsa')?.addEventListener('click',async()=>{
    try{await saveAnam({tipo_cirurgia:document.getElementById('at').value.trim(),data_cirurgia:document.getElementById('ad').value||null,cirurgiao:document.getElementById('ac').value.trim(),historico:document.getElementById('ah').value.trim(),contraindicacoes:document.getElementById('acx').value.trim(),observacoes:document.getElementById('ao').value.trim()});S.editAnam=false;setTab('anamnese');}catch(e){toast('Erro: '+e.message,'err');}
  });
  document.getElementById('bnpk')?.addEventListener('click',modalNovoPk);
}

function bindSessEvts(){
  const fi=document.getElementById('finput'),fd=document.getElementById('fdrop');if(!fd)return;
  fd.addEventListener('click',()=>fi?.click());
  fi?.addEventListener('change',()=>{if(!fi.files.length)return;Array.from(fi.files).forEach(f=>S.fotos.push(f));rFotPrev();updIA();});
  fd.addEventListener('dragover',e=>{e.preventDefault();fd.classList.add('drag');});
  fd.addEventListener('dragleave',()=>fd.classList.remove('drag'));
  fd.addEventListener('drop',e=>{e.preventDefault();fd.classList.remove('drag');Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')).forEach(f=>S.fotos.push(f));rFotPrev();updIA();});
  document.getElementById('baia')?.addEventListener('click',async()=>{
    if(!S.fotos.length)return;const btn=document.getElementById('baia'),div=document.getElementById('aired');
    btn.disabled=true;btn.textContent='Analisando…';div.style.display='block';div.innerHTML='<div class="ai-loading"><div class="ai-spin"></div> Analisando cicatrização…</div>';
    try{
      const r=await avaliarIA(document.getElementById('snotas')?.value?.trim());
      S.iaResult=r;
      div.innerHTML=`<div class="ai-result">${mdHTML(r.resultado||r)}</div>`;
    }catch(e){div.innerHTML=`<div class="ai-result" style="color:rgba(255,120,120,.9)">Erro: ${e.message}</div>`;}
    btn.disabled=false;btn.textContent='Analisar Cicatrização';
  });
  document.getElementById('bss')?.addEventListener('click',async()=>{
    const data=document.getElementById('sdata')?.value;if(!data){toast('Informe a data','err');return;}
    const procs=Array.from(document.querySelectorAll('.proc-check input:checked')).map(e=>e.value);
    const notas=document.getElementById('snotas')?.value?.trim()||'';
    const ia=S.iaResult?{resultado:S.iaResult.resultado||S.iaResult,scores:S.iaResult.scores||null}:null;
    const btn=document.getElementById('bss');btn.textContent='Salvando…';btn.disabled=true;
    try{
      await saveSessao({data_sessao:data,procedimentos:procs,notas,avaliacao_ia:ia});
      S.iaResult=null;
      sessionStorage.removeItem('sessao_draft');
      await loadPac(S.pac.id);nav('paciente');
    }catch(e){toast('Erro: '+e.message,'err');btn.textContent='Salvar Sessão';btn.disabled=false;}
  });

  // Salvar rascunho no sessionStorage ao editar campos
  const saveDraft=()=>{
    try{
      sessionStorage.setItem('sessao_draft',JSON.stringify({
        data:document.getElementById('sdata')?.value||'',
        notas:document.getElementById('snotas')?.value||'',
        procs:Array.from(document.querySelectorAll('.proc-check input:checked')).map(e=>e.value),
        pacId:S.pac?.id||''
      }));
    }catch{}
  };
  document.getElementById('sdata')?.addEventListener('change',saveDraft);
  document.getElementById('snotas')?.addEventListener('input',saveDraft);
  document.querySelectorAll('.proc-check input').forEach(el=>el.addEventListener('change',saveDraft));
}

  document.getElementById('logo-input')?.addEventListener('change',e=>{

      pdf_opts:{
        pagina:document.getElementById('cpdf-pagina')?.value||'A4',
        margem_h:parseInt(document.getElementById('cpdf-mh')?.value)||40,
        margem_v:parseInt(document.getElementById('cpdf-mv')?.value)||40,
        fonte:parseInt(document.getElementById('cpdf-fonte')?.value)||11,
        qualidade:document.getElementById('cpdf-qualidade')?.value||'alta',
        incluir_fotos:document.getElementById('cpdf-fotos')?.checked!==false,
        incluir_ia:document.getElementById('cpdf-ia')?.checked!==false,
        incluir_grafico:document.getElementById('cpdf-grafico')?.checked!==false,
      }};
    try{await saveCfg(dados);render();}catch(e){toast('Erro: '+e.message,'err');}
  });
  document.getElementById('bnprof')?.addEventListener('click',()=>modalEditProf(null));
}

function modalEditProf(id){
  const prof=id?S.profissionais.find(p=>p.id===id):null;
  modal(`<div class="mo-box" style="max-width:480px">
    <div class="mo-hd"><div class="mo-t">${prof?'Editar':'Novo'} Profissional</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div class="fg2">
      <div class="fg" style="grid-column:1/-1"><label class="fl">Nome Completo *</label><input class="fi" id="pnome" value="${prof?.nome||''}"></div>
      <div class="fg"><label class="fl">CREFITO</label><input class="fi" id="pcref" value="${prof?.crefito||''}"></div>
      <div class="fg"><label class="fl">Nível</label>
        <select class="fsel" id="pnivel">
          <option value="admin" ${prof?.nivel==='admin'?'selected':''}>Administrador</option>
          <option value="profissional" ${(!prof||prof?.nivel==='profissional')?'selected':''}>Fisioterapeuta</option>
          <option value="auxiliar" ${prof?.nivel==='auxiliar'?'selected':''}>Auxiliar</option>
        </select>
      </div>
    </div>
    <div class="fg">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px">
        <input type="checkbox" id="pacsens" style="accent-color:var(--primary)" ${prof?.acesso_sensivel!==false?'checked':''}> Acesso a dados sensíveis (fotos, avaliações IA)
      </label>
    </div>
    <div class="fg">
      <label class="fl">PIN de 4 dígitos (deixe vazio para sem PIN)</label>
      <input class="fi" type="password" id="ppin" placeholder="••••" maxlength="4" style="max-width:120px">
      ${prof?.pin_hash?`<div class="cfg-hint">PIN já configurado. Deixe vazio para manter ou preencha para alterar.</div>`:''}
    </div>
    <div class="flex gap8 mt8">
      <button class="btn btn-p" id="bsprof" style="flex:1;justify-content:center">${prof?'Salvar':'Adicionar'}</button>
      ${prof?`<button class="btn btn-g" style="color:#DC2626" onclick="closeMo();deleteProfissional('${prof.id}').then(()=>render())">Remover</button>`:''}
      <button class="btn btn-s" onclick="closeMo()">Cancelar</button>
    </div>
  </div>`);

  document.getElementById('bsprof').addEventListener('click',async()=>{
    const nome=document.getElementById('pnome').value.trim();
    if(!nome){toast('Nome obrigatório','err');return;}
    const pinVal=document.getElementById('ppin').value.trim();
    let pinHash=prof?.pin_hash||null;
    if(pinVal){if(pinVal.length!==4||isNaN(pinVal)){toast('PIN deve ter 4 dígitos numéricos','err');return;}pinHash=await hashPIN(pinVal);}
    const dados={id:prof?.id,nome,crefito:document.getElementById('pcref').value.trim()||null,nivel:document.getElementById('pnivel').value,acesso_sensivel:document.getElementById('pacsens').checked,pin_hash:pinHash};
    try{await saveProfissional(dados);closeMo();render();}catch(e){toast('Erro: '+e.message,'err');}
  });
}

function rFotPrev(){
  const el=document.getElementById('fprev');if(!el)return;
  el.innerHTML=S.fotos.map((f,i)=>`
    <div class="ph-prev" style="position:relative">
      <img src="${URL.createObjectURL(f)}">
      <button class="ph-rm" onclick="rmFoto(${i})">✕</button>
      <input type="text" placeholder="Região (ex: abdômen)" value="${S.fotosRegioes?.[i]||''}"
        style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;border:none;padding:3px 6px;font-size:10px;border-radius:0 0 var(--r-sm) var(--r-sm);font-family:'DM Sans',sans-serif"
        oninput="if(!S.fotosRegioes)S.fotosRegioes=[];S.fotosRegioes[${i}]=this.value">
    </div>`).join('');
}
function rmFoto(i){S.fotos.splice(i,1);rFotPrev();updIA();}
function updIA(){const b=document.getElementById('baia');if(b)b.disabled=!S.fotos.length;}

function navMes(d){S.calMes+=d;if(S.calMes<0){S.calMes=11;S.calAno--;}if(S.calMes>11){S.calMes=0;S.calAno++;}S.calDiaSel=null;const el=document.getElementById('mc');if(el)el.innerHTML=rView();bindAll();}
function selDia(d){S.calDiaSel=S.calDiaSel===d?null:d;const el=document.getElementById('mc');if(el)el.innerHTML=rView();bindAll();}

async function goD(){await loadPacs();nav('dashboard');}
async function openPac(id){await loadPac(id);S.tab='timeline';S.editAnam=false;nav('paciente');}


function toggleSb(){
  document.querySelector('.sidebar').classList.toggle('open');
  document.getElementById('sb-overlay').classList.toggle('open');
}
function closeSb(){
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('open');
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
boot();
</script>
</body>
</html>
