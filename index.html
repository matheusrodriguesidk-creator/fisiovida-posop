<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fisiovida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#EDE9E3;
      --primary:#1B6B6B; --primary-lt:#D4ECEC; --primary-dk:#124F4F; --accent:#E8875A;
      --f1:#D94F4F; --f1-bg:#FDEAEA; --f2:#D4860A; --f2-bg:#FEF3E2; --f3:#2D9E6B; --f3-bg:#E3F5EE;
      --txt:#18181B; --txt2:#52525B; --txt3:#A1A1AA; --border:#E4DDD4; --bord2:#D4CDC4;
      --r:14px; --r-sm:8px; --r-lg:20px;
      --sh:0 1px 8px rgba(0,0,0,.06),0 2px 4px rgba(0,0,0,.04);
      --sh-md:0 4px 20px rgba(0,0,0,.10); --sh-lg:0 8px 40px rgba(0,0,0,.14); --sw:260px;
    }
    html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
    #app{height:100%;display:flex;flex-direction:column;}
    .layout{display:flex;height:100%;}

    /* SIDEBAR */
    .sidebar{width:var(--sw);background:var(--primary-dk);display:flex;flex-direction:column;flex-shrink:0;position:relative;overflow:hidden;}
    .sidebar::after{content:'';position:absolute;bottom:-80px;right:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none;}
    .sb-logo{padding:28px 24px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
    .sb-logo h1{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;letter-spacing:-.3px;}
    .sb-logo span{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:.5px;text-transform:uppercase;font-weight:500;display:block;margin-top:2px;}
    .sb-nav{padding:16px 12px;flex:1;display:flex;flex-direction:column;gap:2px;}
    .nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;color:rgba(255,255,255,.6);font-size:14px;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;}
    .nav-btn:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9);}
    .nav-btn.active{background:rgba(255,255,255,.12);color:#fff;}
    .sb-foot{padding:12px 12px 16px;border-top:1px solid rgba(255,255,255,.08);}
    .u-card{display:flex;align-items:center;gap:10px;padding:8px 12px;}
    .u-av{width:32px;height:32px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:12px;color:#fff;flex-shrink:0;}
    .u-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .u-role{font-size:11px;color:rgba(255,255,255,.4);}
    /* Configurações discreta */
    .nav-btn-cfg{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r-sm);cursor:pointer;color:rgba(255,255,255,.35);font-size:12px;font-weight:400;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:'DM Sans',sans-serif;margin-top:2px;}
    .nav-btn-cfg:hover{color:rgba(255,255,255,.65);background:rgba(255,255,255,.05);}
    .nav-btn-cfg.cfg-active{color:rgba(255,255,255,.75);}
    .btn-sair{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;color:rgba(255,255,255,.3);font-size:11px;font-weight:400;transition:all .15s;border:none;background:none;width:100%;font-family:'DM Sans',sans-serif;margin-top:1px;}
    .btn-sair:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.6);}

    /* MAIN */
    .main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
    .ph{padding:28px 32px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
    .ph-title{font-family:'DM Serif Display',serif;font-size:28px;color:var(--txt);letter-spacing:-.5px;}
    .ph-sub{font-size:14px;color:var(--txt2);margin-top:4px;}
    .pc{padding:24px 32px 48px;flex:1;}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r-sm);font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
    .btn-p{background:var(--primary);color:#fff;}
    .btn-p:hover{background:var(--primary-dk);transform:translateY(-1px);box-shadow:0 4px 12px rgba(27,107,107,.3);}
    .btn-s{background:var(--surface);color:var(--txt);border:1.5px solid var(--border);}
    .btn-s:hover{border-color:var(--bord2);background:var(--surface-2);}
    .btn-g{background:transparent;color:var(--txt2);}
    .btn-g:hover{background:var(--surface-2);color:var(--txt);}
    .btn-sm{padding:6px 12px;font-size:13px;}
    .btn-lg{padding:12px 24px;font-size:15px;}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}

    /* CARDS */
    .card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:20px;box-shadow:var(--sh);}
    .card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .card-t{font-size:15px;font-weight:600;color:var(--txt);}

    /* FORMS */
    .fg{margin-bottom:16px;}
    .fl{display:block;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:6px;letter-spacing:.1px;}
    .fi,.fta,.fsel{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--txt);background:var(--surface);transition:border-color .15s,box-shadow .15s;outline:none;}
    .fi:focus,.fta:focus,.fsel:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-lt);}
    .fta{resize:vertical;min-height:90px;}
    .fg2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}

    /* BADGES */
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
    .b-f1{background:var(--f1-bg);color:var(--f1);}
    .b-f2{background:var(--f2-bg);color:var(--f2);}
    .b-f3{background:var(--f3-bg);color:var(--f3);}
    .b-n{background:var(--surface-2);color:var(--txt2);}
    .b-p{background:var(--primary-lt);color:var(--primary);}

    /* LOGIN */
    .login-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;position:relative;overflow:hidden;}
    .login-bg{position:absolute;inset:0;background:radial-gradient(ellipse 800px 600px at 70% 30%,rgba(27,107,107,.08) 0%,transparent 70%),radial-gradient(ellipse 600px 400px at 20% 80%,rgba(232,135,90,.06) 0%,transparent 70%);}
    .login-card{background:var(--surface);border-radius:var(--r-lg);padding:48px 44px;width:100%;max-width:420px;box-shadow:var(--sh-lg);border:1px solid var(--border);position:relative;z-index:1;}
    .login-logo{text-align:center;margin-bottom:36px;}
    .login-logo h1{font-family:'DM Serif Display',serif;font-size:38px;color:var(--primary);letter-spacing:-.5px;}
    .login-logo p{font-size:12px;color:var(--txt3);margin-top:4px;letter-spacing:1.2px;text-transform:uppercase;font-weight:500;}
    .login-err{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px;display:none;}

    /* STATS */
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
    .stat{background:var(--surface);border-radius:var(--r);padding:20px 22px;border:1px solid var(--border);box-shadow:var(--sh);}
    .stat-lbl{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;}
    .stat-val{font-family:'DM Serif Display',serif;font-size:34px;color:var(--txt);line-height:1.1;margin-top:6px;}
    .stat-dsc{font-size:12px;color:var(--txt3);margin-top:4px;}

    /* SEARCH */
    .search-bar{position:relative;margin-bottom:20px;}
    .search-bar input{width:100%;padding:11px 16px 11px 44px;border:1.5px solid var(--border);border-radius:var(--r);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--surface);color:var(--txt);outline:none;transition:border-color .15s;}
    .search-bar input:focus{border-color:var(--primary);}
    .search-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--txt3);font-size:18px;}

    /* PATIENTS GRID */
    .pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
    .pac-card{background:var(--surface);border-radius:var(--r);padding:20px;border:1.5px solid var(--border);box-shadow:var(--sh);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:14px;}
    .pac-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--sh-md);}
    .pac-card-hd{display:flex;align-items:center;gap:12px;}
    .pac-av{width:44px;height:44px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:17px;color:var(--primary);flex-shrink:0;overflow:hidden;}
    .pac-av img{width:100%;height:100%;object-fit:cover;}
    .pac-nm{font-size:15px;font-weight:600;color:var(--txt);}
    .pac-info{font-size:12px;color:var(--txt2);margin-top:1px;}
    .pac-ft{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);}
    .prog-lbl{font-size:11px;color:var(--txt3);font-weight:500;margin-bottom:4px;}
    .prog-bar{width:120px;height:5px;background:var(--surface-2);border-radius:10px;overflow:hidden;}
    .prog-fill{height:100%;background:var(--primary);border-radius:10px;transition:width .4s;}

    /* PATIENT HERO */
    .p-hero{background:var(--surface);border-radius:var(--r-lg);padding:24px 28px;border:1px solid var(--border);box-shadow:var(--sh);display:flex;align-items:flex-start;gap:20px;margin-bottom:20px;}
    .p-hero-av{width:72px;height:72px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:26px;color:var(--primary);flex-shrink:0;overflow:hidden;border:3px solid var(--primary-lt);}
    .p-hero-av img{width:100%;height:100%;object-fit:cover;}
    .p-hero-nm{font-family:'DM Serif Display',serif;font-size:24px;color:var(--txt);letter-spacing:-.3px;}
    .p-hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
    .meta-it{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--txt2);}
    .p-hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;}

    /* PDF BUTTONS */
    .pdf-btns{display:flex;gap:6px;flex-wrap:wrap;}

    /* PACOTE BAR */
    .pk-bar{background:var(--surface-2);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:18px;border:1px solid var(--border);}
    .pk-info{flex:1;}
    .pk-label{font-size:12px;font-weight:600;color:var(--txt2);}
    .pk-count{font-family:'DM Serif Display',serif;font-size:20px;color:var(--txt);}
    .pk-prog{flex:2;height:8px;background:var(--border);border-radius:10px;overflow:hidden;}
    .pk-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:10px;transition:width .6s;}

    /* TABS */
    .tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:24px;}
    .tab{padding:10px 20px;font-size:14px;font-weight:500;color:var(--txt2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
    .tab:hover{color:var(--txt);}
    .tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}

    /* TIMELINE */
    .timeline{position:relative;padding-left:40px;}
    .timeline::before{content:'';position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:linear-gradient(to bottom,var(--f1),var(--f2),var(--f3));opacity:.25;border-radius:2px;}
    .tl-phase{display:flex;align-items:center;gap:10px;margin:24px 0 12px;position:relative;}
    .tl-phase:first-child{margin-top:0;}
    .tl-phase-dot{position:absolute;left:-31px;width:12px;height:12px;border-radius:50%;}
    .tl-item{position:relative;margin-bottom:14px;}
    .tl-dot{position:absolute;left:-32px;top:16px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);}
    .tl-dot-f1{background:var(--f1);box-shadow:0 0 0 2px var(--f1);}
    .tl-dot-f2{background:var(--f2);box-shadow:0 0 0 2px var(--f2);}
    .tl-dot-f3{background:var(--f3);box-shadow:0 0 0 2px var(--f3);}
    .tl-card{background:var(--surface);border-radius:var(--r);padding:14px 16px;border:1.5px solid var(--border);box-shadow:var(--sh);cursor:pointer;transition:all .2s;}
    .tl-card:hover{border-color:var(--primary);transform:translateX(3px);box-shadow:var(--sh-md);}
    .tl-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .tl-card-t{font-size:14px;font-weight:600;color:var(--txt);}
    .tl-card-d{font-size:12px;color:var(--txt3);}
    .tl-procs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
    .proc-tag{background:var(--primary-lt);color:var(--primary);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
    .tl-photos{display:flex;gap:6px;overflow-x:auto;margin-top:8px;}
    .tl-photo{width:52px;height:52px;border-radius:7px;object-fit:cover;border:1.5px solid var(--border);flex-shrink:0;}
    .tl-empty{text-align:center;padding:56px 24px;background:var(--surface);border-radius:var(--r);border:2px dashed var(--border);}

    /* PROC GRID */
    .proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-top:8px;}
    .proc-check{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--txt2);user-select:none;}
    .proc-check input{display:none;}
    .proc-check:has(input:checked){background:var(--primary-lt);border-color:var(--primary);color:var(--primary);}
    .proc-chk-dot{width:16px;height:16px;border-radius:4px;border:2px solid var(--bord2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
    .proc-check:has(input:checked) .proc-chk-dot{background:var(--primary);border-color:var(--primary);}

    /* PHOTO UPLOAD */
    .photo-drop{border:2px dashed var(--border);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface-2);}
    .photo-drop:hover,.photo-drop.drag{border-color:var(--primary);background:var(--primary-lt);}
    .photos-prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px;}
    .ph-prev{position:relative;aspect-ratio:1;}
    .ph-prev img{width:100%;height:100%;object-fit:cover;border-radius:var(--r-sm);border:1.5px solid var(--border);}
    .ph-rm{position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,.65);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;border:none;}

    /* AI BOX */
    .ai-box{background:linear-gradient(135deg,var(--primary-dk),var(--primary));border-radius:var(--r);padding:22px;color:#fff;margin-top:16px;}
    .ai-box-hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
    .ai-box-t{font-size:14px;font-weight:600;}
    .ai-box-s{font-size:12px;opacity:.7;margin-top:2px;}
    .ai-result{background:rgba(255,255,255,.1);border-radius:var(--r-sm);padding:14px;font-size:13px;line-height:1.65;margin-top:14px;white-space:pre-wrap;max-height:320px;overflow-y:auto;}
    .ai-loading{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.8;margin-top:14px;}
    .ai-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}

    /* MODAL */
    .mo{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:fi .2s forwards;}
    .mo-box{background:var(--surface);border-radius:var(--r-lg);padding:32px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:su .25s forwards;}
    .mo-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
    .mo-t{font-family:'DM Serif Display',serif;font-size:22px;color:var(--txt);}
    .mo-cls{width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--txt2);transition:all .15s;}
    .mo-cls:hover{background:var(--border);}

    /* TOAST */
    .toast-c{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
    .toast{background:var(--txt);color:#fff;padding:12px 18px;border-radius:var(--r-sm);font-size:13px;font-weight:500;box-shadow:var(--sh-md);animation:sir .2s,fo .3s 2.7s forwards;display:flex;align-items:center;gap:8px;max-width:320px;}
    .toast-ok{background:#15803D;} .toast-err{background:#DC2626;}

    /* DATA ROWS */
    .dr{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);gap:16px;}
    .dr:last-child{border-bottom:none;}
    .dr-lbl{font-size:12px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.3px;flex-shrink:0;width:140px;}
    .dr-val{font-size:14px;color:var(--txt);text-align:right;flex:1;}

    /* CONFIG */
    .cfg-sec{background:var(--surface);border-radius:var(--r);padding:24px;border:1px solid var(--border);margin-bottom:16px;}
    .cfg-sec-t{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
    .cfg-hint{font-size:12px;color:var(--txt3);margin-top:4px;}

    /* LOGO PREVIEW */
    .logo-preview{width:80px;height:80px;border-radius:var(--r-sm);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:border-color .15s;background:var(--surface-2);}
    .logo-preview:hover{border-color:var(--primary);}
    .logo-preview img{width:100%;height:100%;object-fit:contain;}

    /* MISC */
    .hidden{display:none!important;}
    .flex{display:flex;} .ai-c{align-items:center;} .jb{justify-content:space-between;}
    .gap8{gap:8px;} .gap12{gap:12px;} .gap16{gap:16px;}
    .mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt24{margin-top:24px;}
    .sec-t{font-size:16px;font-weight:700;color:var(--txt);}
    .divider{height:1px;background:var(--border);margin:20px 0;}
    .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--txt2);cursor:pointer;padding:6px 0;margin-bottom:6px;background:none;border:none;font-family:'DM Sans',sans-serif;font-weight:500;transition:color .15s;}
    .back-btn:hover{color:var(--primary);}

    @keyframes spin{to{transform:rotate(360deg);}}
    @keyframes fi{to{opacity:1;}}
    @keyframes su{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    @keyframes sir{from{transform:translateX(20px);opacity:0;}to{transform:translateX(0);opacity:1;}}
    @keyframes fo{to{opacity:0;transform:translateX(20px);}}
  </style>
</head>
<body>
<div id="app"></div>
<div class="toast-c" id="tc"></div>
<script>
const SUPA_URL = 'https://tvheuwykjdohdqrtwmne.supabase.co';

async function q(fn) {
  for (let i=0;i<3;i++) {
    try {
      const {data:{session}}=await sb.auth.getSession();
      if(!session&&i>0) await sb.auth.refreshSession();
      const r=await fn();
      if(r.error) throw r.error;
      return r.data;
    } catch(e){ if(i===2)throw e; await new Promise(r=>setTimeout(r,1000*(i+1))); }
  }
}

const toast=(msg,tipo='')=>{
  const el=Object.assign(document.createElement('div'),{
    className:`toast${tipo==='ok'?' toast-ok':tipo==='err'?' toast-err':''}`,
    innerHTML:`${tipo==='ok'?'✓':tipo==='err'?'✕':'ℹ'} ${msg}`
  });
  document.getElementById('tc').appendChild(el);
  setTimeout(()=>el.remove(),3100);
};

const ini=n=>n?n.split(' ').slice(0,2).map(x=>x[0]).join('').toUpperCase():'?';
const fmtD=d=>{if(!d)return'—';const[a,m,dia]=d.split('-');return`${dia}/${m}/${a}`;};

function calcFase(dataCir,refDate=null){
  if(!dataCir)return null;
  const dias=Math.floor(((refDate?new Date(refDate):Date.now())-new Date(dataCir))/86400000);
  if(dias<0)return null;
  if(dias<=5)return{nome:'Fase Inflamatória',cls:'f1',dias};
  if(dias<=21)return{nome:'Fase Proliferativa',cls:'f2',dias};
  return{nome:'Fase de Remodelamento',cls:'f3',dias};
}

async function compImg(file,maxW=1200,q2=0.8){
  return new Promise(res=>{
    const c=document.createElement('canvas'),img=new Image();
    img.onload=()=>{const r=Math.min(maxW/img.width,maxW/img.height,1);c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),'image/jpeg',q2);};
    img.onerror=()=>res(file);img.src=URL.createObjectURL(file);
  });
}

async function img64(file,maxW=800){
  return new Promise(res=>{
    const c=document.createElement('canvas'),img=new Image();
    img.onload=()=>{const r=Math.min(maxW/img.width,maxW/img.height,1);c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.75).split(',')[1]);};
    img.src=URL.createObjectURL(file);
  });
}

async function boot(){

async function login(email,pw){

// ── CONFIG ──
async function loadCfg(){
  try{const rows=await q(()=>sb.from('configuracoes').select('*').eq('user_id',S.user.id).limit(1));S.config=rows?.[0]?.dados||{};}
  catch{S.config={};}
}

async function saveCfg(dados){
  await q(()=>sb.from('configuracoes').upsert({user_id:S.user.id,dados,updated_at:new Date().toISOString()},{onConflict:'user_id'}));
  S.config=dados;toast('Configurações salvas','ok');

// ── PACIENTES ──
async function loadPacs(){
  S.pacientes=await q(()=>sb.from('pacientes').select('*,anamnese(*),pacotes(*,sessoes(count))').eq('user_id',S.user.id).order('created_at',{ascending:false}))||[];
}

async function loadPac(id){
  const rows=await q(()=>sb.from('pacientes').select('*,anamnese(*),pacotes(*,sessoes(*,fotos_sessao(*)))').eq('id',id).eq('user_id',S.user.id).limit(1));
  S.pac=rows?.[0]||null;
}

async function savePac(dados){
  if(dados.id){await q(()=>sb.from('pacientes').update(dados).eq('id',dados.id));toast('Paciente atualizado','ok');}
  else{const rows=await q(()=>sb.from('pacientes').insert({...dados,user_id:S.user.id}).select());S.pac=rows?.[0];toast('Paciente cadastrado','ok');}
}

async function saveAnam(dados){
  const ex=S.pac?.anamnese?.[0];
  if(ex)await q(()=>sb.from('anamnese').update({...dados,updated_at:new Date().toISOString()}).eq('id',ex.id));
  else await q(()=>sb.from('anamnese').insert({...dados,paciente_id:S.pac.id}));
  toast('Anamnese salva','ok');await loadPac(S.pac.id);
}

async function savePacote(dados){
  await q(()=>sb.from('pacotes').insert({...dados,paciente_id:S.pac.id}));
  toast('Pacote criado','ok');await loadPac(S.pac.id);
}

// ── SESSÕES ──
async function saveSessao(dados){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');
  if(!pk){toast('Nenhum pacote ativo','err');return null;}
  const n=(pk.sessoes?.length||0)+1;
  const anam=S.pac?.anamnese?.[0];
  const fase=calcFase(anam?.data_cirurgia,dados.data_sessao)?.cls||'f3';
  const rows=await q(()=>sb.from('sessoes').insert({...dados,pacote_id:pk.id,paciente_id:S.pac.id,numero_sessao:n,fase_cicatrizacao:fase.replace('f','fase-'),created_at:new Date().toISOString()}).select());
  const sessao=rows?.[0];if(!sessao)return null;
  for(let i=0;i<S.fotos.length;i++){
    const blob=await compImg(S.fotos[i]);
    const path=`sessoes/${sessao.id}/${Date.now()}_${i}.jpg`;
    const{error:upErr}=await sb.storage.from('fisiovida').upload(path,blob,{contentType:'image/jpeg'});
    if(!upErr){const{data:ud}=sb.storage.from('fisiovida').getPublicUrl(path);await q(()=>sb.from('fotos_sessao').insert({sessao_id:sessao.id,url:ud.publicUrl,ordem:i}));}
  }
  toast(`Sessão ${n} registrada`,'ok');S.fotos=[];return sessao;
}

// ── IA ──
async function avaliarIA(notas){
  const anam=S.pac?.anamnese?.[0];
  const fase=calcFase(anam?.data_cirurgia);
  const{data:{session}}=await sb.auth.getSession();
  if(!session)throw new Error('Sessão expirada, faça login novamente.');

  // Usar prompt customizado ou default
  const promptTemplate=S.config.prompt_avaliacao||DEFAULT_PROMPT;
  const promptFinal=promptTemplate
    .replace('{{tipo_cirurgia}}',anam?.tipo_cirurgia||'não informado')
    .replace('{{data_cirurgia}}',fmtD(anam?.data_cirurgia))
    .replace('{{fase}}',fase?`${fase.nome} (D${fase.dias})`:'não calculada')
    .replace('{{cirurgiao}}',anam?.cirurgiao||'não informado')
    .replace('{{historico}}',anam?.historico||'—')
    .replace('{{contraindicacoes}}',anam?.contraindicacoes||'nenhuma')
    .replace('{{notas}}',notas||'—');

  const content=[];
  for(const f of S.fotos.slice(0,3)){try{content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await img64(f)}});}catch{}}
  content.push({type:'text',text:promptFinal});

  const r=await fetch(`${SUPA_URL}/functions/v1/ia-proxy`,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
    body:JSON.stringify({model:AI_MODEL,max_tokens:1024,messages:[{role:'user',content}]})
  });
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||`Erro ${r.status}`);
  return d.content?.[0]?.text||'Sem resultado.';
}

function gerarRelatorioPaciente(){
  const p=S.pac;if(!p){toast('Nenhum paciente selecionado','err');return;}
  const a=p.anamnese?.[0]||{};
  const pk=p.pacotes?.find(pk=>pk.status==='ativo');
  const sessoes=(pk?.sessoes||[]).sort((x,y)=>new Date(x.data_sessao)-new Date(y.data_sessao));
  const fase=calcFase(a.data_cirurgia);
  const cor=corPDF();
  const feitas=sessoes.length,total=pk?.total_sessoes||0;
  const pct=total>0?Math.round((feitas/total)*100):0;

  const content=[...pdfHeader('Relatório de Acompanhamento',cor)];

  // Paciente
  content.push({text:p.nome,fontSize:22,bold:true,color:'#18181B',margin:[0,0,0,4]});
  content.push({columns:[
    a.tipo_cirurgia?{text:`✂ ${a.tipo_cirurgia}`,fontSize:11,color:'#52525B'}:{text:''},
    a.data_cirurgia?{text:`Cirurgia: ${fmtD(a.data_cirurgia)}`,fontSize:11,color:'#52525B'}:{text:''},
    fase?{text:`${fase.nome} · D${fase.dias}`,fontSize:11,bold:true,color:cor}:{text:''}
  ],margin:[0,0,0,16]});

  // Progresso
  if(pk){
    content.push({text:'Progresso do Tratamento',style:'sectionHd'});
    content.push({table:{widths:['*'],body:[[{stack:[
      {text:`${feitas} de ${total} sessões concluídas (${pct}%)`,fontSize:11,color:'#52525B',margin:[0,0,0,6]},
      {canvas:[
        {type:'rect',x:0,y:0,w:467,h:8,r:4,color:'#E4DDD4'},
        {type:'rect',x:0,y:0,w:Math.round((feitas/Math.max(total,1))*467),h:8,r:4,color:cor}
      ]}
    ],margin:[12,12,12,12]}]]},layout:{hLineWidth:()=>1,vLineWidth:()=>1,hLineColor:()=>'#E4DDD4',vLineColor:()=>'#E4DDD4'},margin:[0,0,0,20]});
  }

  // Sessões
  if(sessoes.length){
    content.push({text:'Histórico de Sessões',style:'sectionHd'});
    sessoes.forEach(s=>{
      const procs=Array.isArray(s.procedimentos)?s.procedimentos:JSON.parse(s.procedimentos||'[]');
      const fLabel={'fase-1':'Fase Inflamatória','fase-2':'Fase Proliferativa','fase-3':'Fase de Remodelamento'};
      const rows=[[
        {text:`Sessão ${s.numero_sessao}`,bold:true,color:'#fff',fontSize:12,fillColor:cor,margin:[8,6,8,6]},
        {text:`${fmtD(s.data_sessao)}  ·  ${fLabel[s.fase_cicatrizacao]||''}`,fontSize:11,color:'#52525B',margin:[8,6,8,6],fillColor:'#F8F6F2'}
      ]];
      if(procs.length) rows.push([{text:'Procedimentos:',fontSize:10,bold:true,color:'#A1A1AA',margin:[8,4,8,2]},{text:procs.join('  ·  '),fontSize:11,margin:[8,4,8,4]}]);
      if(s.notas) rows.push([{text:'Evolução:',fontSize:10,bold:true,color:'#A1A1AA',margin:[8,4,8,2]},{text:s.notas,fontSize:11,margin:[8,4,8,8]}]);
      if(s.avaliacao_ia?.resultado) rows.push([{text:'Avaliação IA:',fontSize:10,bold:true,color:'#A1A1AA',margin:[8,4,8,2]},{text:s.avaliacao_ia.resultado,fontSize:11,margin:[8,4,8,8]}]);
      content.push({table:{widths:['auto','*'],body:rows},layout:{hLineWidth:(i)=>i===0?0:.5,vLineWidth:()=>0,hLineColor:()=>'#E4DDD4'},margin:[0,0,0,12]});
    });
  }

  content.push(...pdfRodape(cor));
  pdfMake.createPdf({pageSize:'A4',pageMargins:[40,40,40,60],content,styles:pdfStyles(cor),defaultStyle:{font:'Roboto'}})
    .download(`Relatorio_${p.nome.replace(/\s+/g,'_')}.pdf`);
}

function rLogin(){return`<div class="login-pg"><div class="login-bg"></div><div class="login-card">

  <button class="btn btn-p btn-lg" style="width:100%;justify-content:center;margin-top:8px" id="lbtn">Entrar</button>
</div></div>`;}

function bindLogin(){
  const btn=document.getElementById('lbtn');
  const doLogin=async()=>{
    const email=document.getElementById('lemail').value.trim(),pw=document.getElementById('lsnh').value;
    const err=document.getElementById('lerr');err.style.display='none';
    if(!email||!pw){err.textContent='Preencha e-mail e senha.';err.style.display='block';return;}
    btn.textContent='Entrando…';btn.disabled=true;
    try{await login(email,pw);}
    catch{err.textContent='E-mail ou senha incorretos.';err.style.display='block';btn.textContent='Entrar';btn.disabled=false;}
  };
  btn?.addEventListener('click',doLogin);
  document.getElementById('lsnh')?.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}

  return`<div class="pac-card" onclick="openPac('${p.id}')">

function setTab(t){

function rTab(){

function rTimeline(){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');
  const all=(pk?.sessoes||[]).sort((a,b)=>new Date(a.data_sessao)-new Date(b.data_sessao));
  if(!all.length)return`<div class="tl-empty"><div style="font-size:48px;margin-bottom:14px">🌱</div><div style="font-size:16px;font-weight:600;color:var(--txt2)">Jornada ainda não iniciada</div><div style="font-size:13px;color:var(--txt3);margin-top:4px">Registre a primeira sessão para começar a linha do tempo</div><button class="btn btn-p mt16" onclick="nav('sessao')">+ Primeira Sessão</button></div>`;
  const por={'fase-1':[],'fase-2':[],'fase-3':[]};
  all.forEach(s=>{(por[s.fase_cicatrizacao]||por['fase-3']).push(s);});
  const labels={'fase-1':{cor:'var(--f1)',nm:'🔴 Fase Inflamatória',sub:'D0 — D5'},'fase-2':{cor:'var(--f2)',nm:'🟡 Fase Proliferativa',sub:'D6 — D21'},'fase-3':{cor:'var(--f3)',nm:'🟢 Fase de Remodelamento',sub:'D22+'}};
  let h='<div class="timeline">';
  ['fase-1','fase-2','fase-3'].forEach(f=>{
    const its=por[f];if(!its.length)return;
    const lb=labels[f];
    h+=`<div class="tl-phase"><div class="tl-phase-dot" style="background:${lb.cor}"></div><span style="font-size:14px;font-weight:700;color:${lb.cor}">${lb.nm}</span><span style="font-size:12px;color:var(--txt3);margin-left:6px">${lb.sub}</span></div>`;
    its.forEach(s=>{
      const procs=Array.isArray(s.procedimentos)?s.procedimentos:JSON.parse(s.procedimentos||'[]');
      const fotos=s.fotos_sessao||[];
      h+=`<div class="tl-item" onclick="verSessao('${s.id}')"><div class="tl-dot tl-dot-${f.replace('fase-','f')}"></div><div class="tl-card"><div class="tl-card-hd"><div class="tl-card-t">Sessão ${s.numero_sessao}</div><div class="tl-card-d">${fmtD(s.data_sessao)}</div></div>${procs.length?`<div class="tl-procs">${procs.map(p=>`<span class="proc-tag">${p}</span>`).join('')}</div>`:''} ${s.notas?`<div style="font-size:12px;color:var(--txt2);line-height:1.5">${s.notas.substring(0,120)}${s.notas.length>120?'…':''}</div>`:''} ${fotos.length?`<div class="tl-photos">${fotos.map(f=>`<img class="tl-photo" src="${f.url}" loading="lazy">`).join('')}</div>`:''}</div></div>`;
    });
  });
  h+='</div>';return h;
}

function closeMo(){document.querySelectorAll('.mo').forEach(e=>e.remove());}

function modalNovoPac(){
  modal(`<div class="mo-box"><div class="mo-hd"><div class="mo-t">Novo Paciente</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div class="fg2">
      <div class="fg" style="grid-column:1/-1"><label class="fl">Nome Completo *</label><input class="fi" id="mn" placeholder="Nome completo"></div>
      <div class="fg"><label class="fl">Data de Nascimento</label><input class="fi" type="date" id="mdn"></div>
      <div class="fg"><label class="fl">Telefone</label><input class="fi" id="mt" placeholder="(00) 00000-0000"></div>
      <div class="fg" style="grid-column:1/-1"><label class="fl">E-mail</label><input class="fi" type="email" id="me" placeholder="paciente@email.com"></div>
    </div>
    <div class="flex gap8 mt8"><button class="btn btn-p" id="mcp" style="flex:1;justify-content:center">Cadastrar</button><button class="btn btn-s" onclick="closeMo()">Cancelar</button></div>
  </div>`);
  document.getElementById('mcp').addEventListener('click',async()=>{
    const nome=document.getElementById('mn').value.trim();
    if(!nome){toast('Nome obrigatório','err');return;}
    try{await savePac({nome,data_nascimento:document.getElementById('mdn').value||null,telefone:document.getElementById('mt').value.trim()||null,email:document.getElementById('me').value.trim()||null});closeMo();if(S.pac?.id){await loadPac(S.pac.id);nav('paciente');}}
    catch(e){toast('Erro: '+e.message,'err');}
  });
}

function modalEditPac(){
  const p=S.pac;
  modal(`<div class="mo-box"><div class="mo-hd"><div class="mo-t">Editar Paciente</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div class="fg2">
      <div class="fg" style="grid-column:1/-1"><label class="fl">Nome Completo</label><input class="fi" id="mn" value="${p.nome}"></div>
      <div class="fg"><label class="fl">Data de Nascimento</label><input class="fi" type="date" id="mdn" value="${p.data_nascimento||''}"></div>
      <div class="fg"><label class="fl">Telefone</label><input class="fi" id="mt" value="${p.telefone||''}"></div>
      <div class="fg" style="grid-column:1/-1"><label class="fl">E-mail</label><input class="fi" type="email" id="me" value="${p.email||''}"></div>
    </div>
    <div class="flex gap8 mt8"><button class="btn btn-p" id="mcp" style="flex:1;justify-content:center">Salvar</button><button class="btn btn-s" onclick="closeMo()">Cancelar</button></div>
  </div>`);
  document.getElementById('mcp').addEventListener('click',async()=>{
    try{await savePac({id:p.id,nome:document.getElementById('mn').value.trim(),data_nascimento:document.getElementById('mdn').value||null,telefone:document.getElementById('mt').value.trim()||null,email:document.getElementById('me').value.trim()||null});closeMo();await loadPac(p.id);setTab('dados');}
    catch(e){toast('Erro: '+e.message,'err');}
  });
}

function modalNovoPk(){
  modal(`<div class="mo-box"><div class="mo-hd"><div class="mo-t">Novo Pacote</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div class="fg"><label class="fl">Descrição</label><input class="fi" id="pd" value="Pacote Pós-Operatório"></div>
    <div class="fg2">
      <div class="fg"><label class="fl">Total de Sessões</label><input class="fi" type="number" id="pt" value="15" min="1"></div>
      <div class="fg"><label class="fl">Data de Início</label><input class="fi" type="date" id="pi" value="${new Date().toISOString().split('T')[0]}"></div>
    </div>
    <div class="flex gap8 mt8"><button class="btn btn-p" id="cpk" style="flex:1;justify-content:center">Criar Pacote</button><button class="btn btn-s" onclick="closeMo()">Cancelar</button></div>
  </div>`);
  document.getElementById('cpk').addEventListener('click',async()=>{
    try{await savePacote({descricao:document.getElementById('pd').value.trim(),total_sessoes:parseInt(document.getElementById('pt').value)||15,data_inicio:document.getElementById('pi').value,status:'ativo'});closeMo();setTab('pacote');}
    catch(e){toast('Erro: '+e.message,'err');}
  });
}

function verSessao(id){
  const pk=S.pac?.pacotes?.find(p=>p.status==='ativo');
  const s=pk?.sessoes?.find(s=>s.id===id);if(!s)return;
  const procs=Array.isArray(s.procedimentos)?s.procedimentos:JSON.parse(s.procedimentos||'[]');
  const fotos=s.fotos_sessao||[];
  const fLabel={'fase-1':'🔴 Inflamatória','fase-2':'🟡 Proliferativa','fase-3':'🟢 Remodelamento'};
  const fCls={'fase-1':'f1','fase-2':'f2','fase-3':'f3'};
  const fc=s.fase_cicatrizacao||'fase-3';
  modal(`<div class="mo-box" style="max-width:640px">
    <div class="mo-hd"><div class="mo-t">Sessão ${s.numero_sessao}</div><button class="mo-cls" onclick="closeMo()">✕</button></div>
    <div class="flex gap8 ai-c" style="margin-bottom:18px"><span class="badge b-${fCls[fc]}">${fLabel[fc]||fc}</span><span style="font-size:13px;color:var(--txt3)">${fmtD(s.data_sessao)}</span></div>
    ${procs.length?`<div class="sec-t" style="margin-bottom:10px">Procedimentos</div><div class="tl-procs" style="margin-bottom:18px">${procs.map(p=>`<span class="proc-tag">${p}</span>`).join('')}</div>`:''}
    ${s.notas?`<div class="sec-t" style="margin-bottom:8px">Evolução</div><div style="font-size:14px;color:var(--txt2);line-height:1.65;white-space:pre-wrap;margin-bottom:18px">${s.notas}</div>`:''}
    ${s.avaliacao_ia?.resultado?`<div class="sec-t" style="margin-bottom:8px">✦ Avaliação de Cicatrização (IA)</div><div style="background:var(--primary-lt);border-radius:var(--r-sm);padding:14px;font-size:13px;line-height:1.65;color:var(--primary-dk);white-space:pre-wrap;margin-bottom:18px">${s.avaliacao_ia.resultado}</div>`:''}
    ${fotos.length?`<div class="sec-t" style="margin-bottom:10px">📸 Fotos</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px">${fotos.map(f=>`<img src="${f.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1.5px solid var(--border)">`).join('')}</div>`:''}
  </div>`);
}

// ── BINDINGS ──
function bindAll(){bindDash();bindSessEvts();bindCfgEvts();bindTabEvts();}

function bindDash(){
  document.getElementById('bnp')?.addEventListener('click',()=>{S.pac=null;modalNovoPac();});
  document.getElementById('busca')?.addEventListener('input',e=>{
    const q2=e.target.value.toLowerCase(),pg=document.getElementById('pg');if(!pg)return;
    const fs=S.pacientes.filter(p=>{const a=p.anamnese?.[0];return p.nome.toLowerCase().includes(q2)||(a?.tipo_cirurgia||'').toLowerCase().includes(q2);});
    pg.innerHTML=fs.length?fs.map(rPacCard).join(''):'<div style="grid-column:1/-1;text-align:center;padding:48px;color:var(--txt3)">Nenhum paciente encontrado</div>';
  });
}

function bindTabEvts(){
  document.getElementById('bsa')?.addEventListener('click',async()=>{
    try{await saveAnam({tipo_cirurgia:document.getElementById('at').value.trim(),data_cirurgia:document.getElementById('ad').value||null,cirurgiao:document.getElementById('ac').value.trim(),historico:document.getElementById('ah').value.trim(),contraindicacoes:document.getElementById('acx').value.trim(),observacoes:document.getElementById('ao').value.trim()});S.editAnam=false;setTab('anamnese');}
    catch(e){toast('Erro: '+e.message,'err');}
  });
  document.getElementById('bnpk')?.addEventListener('click',modalNovoPk);
}

function bindSessEvts(){
  const fi=document.getElementById('finput'),fd=document.getElementById('fdrop');
  if(!fd)return;
  fd.addEventListener('click',()=>fi?.click());
  fi?.addEventListener('change',()=>{if(!fi.files.length)return;Array.from(fi.files).forEach(f=>S.fotos.push(f));rFotPrev();updIA();});
  fd.addEventListener('dragover',e=>{e.preventDefault();fd.classList.add('drag');});
  fd.addEventListener('dragleave',()=>fd.classList.remove('drag'));
  fd.addEventListener('drop',e=>{e.preventDefault();fd.classList.remove('drag');Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')).forEach(f=>S.fotos.push(f));rFotPrev();updIA();});

  document.getElementById('baia')?.addEventListener('click',async()=>{
    if(!S.fotos.length)return;
    const btn=document.getElementById('baia'),div=document.getElementById('aired');
    btn.disabled=true;btn.textContent='Analisando…';div.style.display='block';
    div.innerHTML='<div class="ai-loading"><div class="ai-spin"></div> Analisando cicatrização…</div>';
    try{const r=await avaliarIA(document.getElementById('snotas')?.value?.trim());S.iaResult=r;div.innerHTML=`<div class="ai-result">${r}</div>`;}
    catch(e){div.innerHTML=`<div class="ai-result" style="color:rgba(255,120,120,.9)">Erro: ${e.message}</div>`;}
    btn.disabled=false;btn.textContent='Analisar Cicatrização';
  });

  document.getElementById('bss')?.addEventListener('click',async()=>{
    const data=document.getElementById('sdata')?.value;
    if(!data){toast('Informe a data','err');return;}
    const procs=Array.from(document.querySelectorAll('.proc-check input:checked')).map(e=>e.value);
    const notas=document.getElementById('snotas')?.value?.trim()||'';
    const ia=S.iaResult?{resultado:S.iaResult}:null;
    const btn=document.getElementById('bss');btn.textContent='Salvando…';btn.disabled=true;
    try{await saveSessao({data_sessao:data,procedimentos:procs,notas,avaliacao_ia:ia});S.iaResult=null;await loadPac(S.pac.id);nav('paciente');}
    catch(e){toast('Erro: '+e.message,'err');btn.textContent='Salvar Sessão';btn.disabled=false;}
  });
}

function bindCfgEvts(){
  // Sync color picker e hex input
  document.getElementById('cpdfcor')?.addEventListener('input',e=>{
    const hex=document.getElementById('cpdfcor-hex');if(hex)hex.value=e.target.value;
  });
  document.getElementById('cpdfcor-hex')?.addEventListener('input',e=>{
    if(/^#[0-9A-Fa-f]{6}$/.test(e.target.value)){const cp=document.getElementById('cpdfcor');if(cp)cp.value=e.target.value;}
  });

  // Logo upload
  document.getElementById('logo-input')?.addEventListener('change',e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      S.config.pdf_logo=ev.target.result;
      const prev=document.getElementById('logo-prev');
      if(prev)prev.innerHTML=`<img src="${ev.target.result}" id="logo-img">`;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('bscfg')?.addEventListener('click',async()=>{
    const dados={
      ...S.config,
      nome_profissional:document.getElementById('cn').value.trim(),
      crefito:document.getElementById('cc').value.trim(),
      clinica:document.getElementById('ccl').value.trim(),
      telefone:document.getElementById('ct').value.trim(),
      endereco:document.getElementById('ce').value.trim(),
      claude_api_key:document.getElementById('capi').value.trim(),
      prompt_avaliacao:document.getElementById('cprompt').value.trim(),
      pdf_cor:document.getElementById('cpdfcor').value,
      pdf_clinica:document.getElementById('cpdfclinica').value.trim(),
      pdf_rodape:document.getElementById('cpdfrodape').value.trim(),
    };
    try{await saveCfg(dados);render();}
    catch(e){toast('Erro: '+e.message,'err');}
  });
}

function rFotPrev(){
  const el=document.getElementById('fprev');if(!el)return;
  el.innerHTML=S.fotos.map((f,i)=>`<div class="ph-prev"><img src="${URL.createObjectURL(f)}"><button class="ph-rm" onclick="rmFoto(${i})">✕</button></div>`).join('');
}
function rmFoto(i){S.fotos.splice(i,1);rFotPrev();updIA();}
function updIA(){const b=document.getElementById('baia');if(b)b.disabled=!S.fotos.length;}

// ── NAVIGATION ──
async function goD(){await loadPacs();nav('dashboard');}
async function openPac(id){await loadPac(id);S.tab='timeline';S.editAnam=false;nav('paciente');}

boot();
</script>
</body>
</html>
